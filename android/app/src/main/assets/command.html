<!DOCTYPE html>

    <p class="place">العين · الإمارات</p>

<div id="app">
  <header>
    <button id="back" type="button" hidden aria-label="رجوع">↩</button>
    <div class="mark">HMK<small id="place">العين · الإمارات</small></div>
    <h1 id="title">الرئيسية</h1>
    <div id="themes"><button type="button" data-theme="alain">العين</button><button type="button" data-theme="uae">الإمارات</button></div>
  </header>
  <div class="flagbar"></div>
  <main id="pages"></main>
  <footer>
    <button type="button" data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>الرئيسية</button>
    <button type="button" data-tab="projects"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>المشاريع</button>

</div>
<div id="ask" hidden><div class="sheet"><p id="ask-text"></p><div class="actions"><button type="button" class="primary" id="ask-yes">تأكيد</button><button type="button" id="ask-no">إلغاء</button></div></div></div>
<script src="command.js"></script>
</body>
</html>
