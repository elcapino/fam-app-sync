<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مقر الشركة الذكي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1e0f3a;color:#fff;font-family:system-ui,Tahoma,Arial,sans-serif}
#app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#2a1450;overflow:hidden}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 8px;background:#5B2C83;border-top:3px solid #C8102E;border-bottom:2px solid #d4af37}
header h1{font-size:15px;color:#f1d37a}
#clock{font-size:13px;background:#1e0f3a;border:1px solid #d4af37;padding:2px 6px;border-radius:2px;direction:ltr}
#bar{flex:none;display:flex;gap:3px;padding:3px 6px;background:#2a1450}
#bar button{flex:1;border:1px solid #5b2d91;border-radius:12px;background:#3b1f6b;color:#cbb8ee;padding:3px 2px;font:11px system-ui;cursor:pointer}
#bar button.on{background:#d4af37;color:#1e0f3a;border-color:#d4af37}
#stage{flex:1;min-height:0;overflow:auto;background:#1e0f3a}
#map{position:relative}
.sky{height:72px;position:relative;background:linear-gradient(#1a0c32,#3b1f6b 55%,#5b2d91);overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;animation:tw 1.8s steps(2) infinite}
.moon{position:absolute;right:22px;top:10px;width:16px;height:16px;background:#f1d37a;box-shadow:-2px 0 0 #d4af37,2px 2px 0 #1a0c32}
.hill{position:absolute;left:0;right:0;bottom:0;height:22px;background:#4a2680}
.hill:before{content:"";position:absolute;inset:0;background:#5b2d91;clip-path:polygon(0 100%,0 55%,8% 30%,16% 62%,28% 12%,40% 58%,52% 8%,64% 50%,76% 18%,88% 55%,100% 22%,100% 100%)}
.hill:after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:#3b1f6b}
.palm{position:absolute;bottom:4px;width:3px;height:22px;background:#8a5a2b}
.palm:before,.palm:after{content:"";position:absolute;top:-1px;width:8px;height:3px;background:#2f9e5a}
.palm:before{left:-8px;box-shadow:0 -4px 0 #1f7a42}
.palm:after{right:-8px;box-shadow:0 -4px 0 #1f7a42}
.banner{margin:4px 6px 2px;padding:3px 8px;text-align:center;font-size:12px;color:#1e0f3a;background:#f1d37a;border:2px solid #d4af37}
.grid{display:grid;grid-template-columns:1fr 78px 1fr;gap:4px;padding:0 4px 8px}
.room{border:2px solid #d4af37;background:repeating-linear-gradient(45deg,#4a2680 0 4px,#52298a 4px 8px);min-height:96px;padding:0 2px 4px;position:relative;overflow:hidden}
.room h3{font-size:10px;color:#fff;text-align:center;background:#3b1f6b;border-bottom:1px solid #d4af37;padding:3px 2px;line-height:1.2}
.room.archive{filter:grayscale(.9);opacity:.75;border-color:#8a8498}
.room .crew{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-content:flex-start;padding-top:3px}
.spine{background:repeating-linear-gradient(#d4af37 0 6px,transparent 6px 12px) center/2px 100% no-repeat;min-height:96px}
.ceo{border:2px solid #d4af37;background:#3b1f6b;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.ceo .desk{width:46px}
.guy{position:relative;border:0;background:none;color:#fff;width:54px;max-width:100%;flex:0 0 auto;padding:0 1px;cursor:pointer;text-align:center;overflow:hidden}
.dot{position:absolute;top:0;left:50%;width:7px;height:7px;margin-left:-4px;border:1px solid #1e0f3a;z-index:2}
.dot.up{background:#3ccf8e}.dot.idle{background:#9a94a8}.dot.error{background:#ef5b5b}.dot.hold,.dot.paper{background:#e8a93a}
.px{display:block;width:22px;margin:8px auto 0;image-rendering:pixelated}
.px b{display:block;width:12px;height:10px;margin:0 auto;background:#fff;position:relative;box-shadow:0 0 0 1px #1e0f3a}
.px b:before{content:"";position:absolute;left:2px;top:3px;width:2px;height:2px;background:#1e0f3a;box-shadow:6px 0 #1e0f3a}
.px em{display:block;width:16px;height:9px;margin:1px auto 0;background:#efeaf8}
.px.crown:before{content:"";display:block;width:14px;height:4px;margin:0 auto 1px;background:#d4af37;box-shadow:0 -3px 0 #f1d37a,4px -3px 0 #d4af37,-4px -3px 0 #d4af37}
.desk{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:12px;margin:1px auto 0}
.mon{width:12px;height:8px;background:#10243a;border:1px solid #d4af37;box-shadow:inset 0 0 0 1px #7fd0ff;animation:glow 1.6s steps(2) infinite}
.prop{width:8px;height:8px;background:#d4af37}
.prop.hammer{background:#8a5a2b;box-shadow:0 -3px 0 #d4af37,3px -3px 0 #d4af37}
.prop.cart{background:#c9a24a;box-shadow:-2px 3px 0 #1e0f3a,4px 3px 0 #1e0f3a}
.prop.chart{background:linear-gradient(90deg,#3ccf8e 30%,transparent 30% 45%,#d4af37 45% 70%,transparent 70% 80%,#7fd0ff 80%)}
.prop.phone{width:6px;height:9px;background:#1e0f3a;border:1px solid #d4af37}
.prop.news{background:#fff;box-shadow:inset 0 2px 0 #1e0f3a,inset 0 4px 0 #fff,inset 0 5px 0 #1e0f3a}
.prop.cam{background:#1e0f3a;box-shadow:3px 2px 0 #d4af37}
.prop.chat{background:#fff;border-radius:2px;box-shadow:2px 3px 0 #d4af37}
.prop.wrench{background:transparent;box-shadow:0 0 0 2px #d4af37;transform:rotate(40deg)}
.guy small{display:block;max-width:100%;font-size:8px;line-height:1.15;color:#fff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.guy.hide{display:none}
.guy.walk{z-index:4}
.guy.walk .px em{animation:step .22s steps(2) infinite}
@keyframes tw{50%{opacity:.25}}
@keyframes glow{50%{box-shadow:inset 0 0 0 1px #d4af37}}
@keyframes step{50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.star,.mon,.guy.walk .px em{animation:none}}
#tree{padding:8px 12px 12px;display:none}
#tree.on{display:block}
#map.off{display:none}
.node{border-right:2px solid #d4af37;margin:2px 8px;padding:2px 8px;font-size:12px}
.node b{color:#f1d37a}
.node .sub{margin-right:10px;font-size:11px;color:#fff}
.arch{color:#b3a3d1}
#tip{position:sticky;bottom:0;display:none;background:#1e0f3a;color:#fff;border-top:2px solid #d4af37;padding:6px 8px;font-size:11px;line-height:1.4}
#panel{flex:none;max-height:34%;overflow:auto;padding:4px 8px;background:#2a1450;font-size:11px}
#tabs{flex:none;display:flex;background:#3b1f6b;border-top:2px solid #d4af37}
#tabs button{flex:1;background:none;border:0;color:#cbb8ee;font:11px system-ui;padding:6px 2px;cursor:pointer}
#tabs button.on{background:#5b2d91;color:#d4af37;font-weight:700}
footer{flex:none;text-align:center;font-size:9px;color:#fff;background:#000;padding:2px}
h2{font-size:12px;color:#d4af37;margin:2px 0}
.chk{display:flex;align-items:center;gap:6px;padding:3px 6px;margin-bottom:2px;background:#3b1f6b;border:1px solid #5b2d91;font-size:11px}
.chk .bx{flex:none;width:14px;height:14px;border:1px solid #d4af37}
.chk.done{opacity:.6;text-decoration:line-through}
.card{background:#3b1f6b;border:1px solid #5b2d91;padding:4px 6px;margin-bottom:3px}
.lv{display:flex;gap:6px;align-items:center;font-size:10px;margin-bottom:2px}
.lv .bar{flex:1;height:8px;background:#1e0f3a;border:1px solid #5b2d91}
.lv .bar i{display:block;height:100%;background:#d4af37}
.empty{color:#cbb8ee;padding:4px}
</style>
</head>
<body>
<div id="app">
  <header><h1>مقر الشركة الذكي</h1><div id="clock">--:--</div></header>
  <nav id="bar">
    <button data-f="all" class="on">الكل</button>
    <button data-f="working">يعمل الآن</button>
    <button data-f="error">متعطل</button>
    <button data-f="idle">خامل</button>
    <button id="orgbtn" type="button">الهيكل</button>
  </nav>
  <div id="stage">
    <div id="map">
      <div class="sky" id="sky" aria-hidden="true"><div class="moon"></div><div class="hill"></div>
        <div class="palm" style="left:8px"></div><div class="palm" style="left:36%"></div><div class="palm" style="right:34%"></div><div class="palm" style="right:10px"></div>
      </div>
      <div class="banner" id="owner"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div id="tree"></div>
    <div id="tip"></div>
  </div>
  <div id="panel"></div>
  <nav id="tabs">
    <button data-t="brief" class="on">إيجاز الصباح</button>
    <button data-t="meeting">اجتماع الأحد</button>
    <button data-t="levels">المستويات</button>
    <button data-t="skills">مكتبة المهارات</button>
  </nav>
  <footer>HMK made in ALAIN</footer>
</div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let D={brief:{your_part:[],needs_you:[]},meeting:{broke:[],wins:[]},agents:[],skills:[]};
let ORG=null,filter='all',tab='brief',treeOn=false,walker=null,nextWalk=250;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tx(o){return !o?'':typeof o=='string'?o:(o.ar||o.en||'');}
function bubble(st){return st==='hold'?'موقوف':st==='paper'?'ورقي':st==='error'?'متعطل':st==='idle'?'خامل':'يعمل';}
function shown(st){if(filter==='all')return true;if(filter==='working')return st==='up';if(filter==='error')return st==='error';return st==='idle'||st==='hold'||st==='paper';}
function privateBlock(s){return /kids|child|أطفال|اطفال|لعبة|ألعاب/i.test(String(s||''));}

document.querySelectorAll('#bar [data-f]').forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;treeOn=false;
  document.querySelectorAll('#bar button').forEach(x=>x.classList.toggle('on',x===b));
  $('#map').classList.remove('off');$('#tree').classList.remove('on');
  applyFilter();
});
$('#orgbtn').onclick=()=>{
  treeOn=!treeOn;
  $('#orgbtn').classList.toggle('on',treeOn);
  $('#map').classList.toggle('off',treeOn);
  $('#tree').classList.toggle('on',treeOn);
  if(treeOn){drawTree();$('#stage').scrollTop=0;}
};

const PROP={house:'hammer',shop:'cart',trade:'chart',apps:'phone',news:'news',video:'cam',fahem:'chat',experts:'wrench'};
function stars(){
  const s=$('#sky');if(!s||s.dataset.ready)return;s.dataset.ready=1;
  for(let i=0;i<18;i++){const e=document.createElement('i');e.className='star';e.style.left=(6+i*19)%360+'px';e.style.top=(4+(i*13)%28)+'px';e.style.animationDelay=(i%5)*0.3+'s';s.appendChild(e);}
}
function drawMap(){
  if(!ORG)return;
  stars();
  $('#owner').textContent='المالك: '+ORG.owner.ar;
  const deps=ORG.departments.filter(d=>d.id!=='meet');
  const meet=ORG.departments.find(d=>d.id==='meet');
  let html='',n=0;
  const cells=[];
  deps.forEach(d=>cells.push(d));
  if(meet)cells.push(meet);
  const rows=Math.ceil((cells.length+1)/2);
  const ceoRow=Math.min(1,rows-1);
  let ci=0;
  for(let r=0;r<rows;r++){
    const left=cells[ci++]||null,right=cells[ci++]||null;
    html+=(left?room(left):'<div></div>');
    html+=r===ceoRow?`<div class="ceo" id="ceo">${person(ORG.ceo,true,null)}</div>`:'<div class="spine"></div>';
    html+=(right?room(right):'<div></div>');
  }
  const ar=ORG.archive;
  html+=`<article class="room archive" data-id="archive"><h3>${esc(ar.ar)}</h3><div class="crew"><small class="arch">${esc(tx(ar.note))}</small></div></article><div class="spine"></div><div></div>`;
  $('#grid').innerHTML=html;
  $('#grid').querySelectorAll('.guy').forEach(g=>g.onclick=ev=>{ev.stopPropagation();tip(g.dataset.id);});
  applyFilter();
}
function room(dep){
  const prop=PROP[dep.id]||'';
  const crew=(dep.bots||[]).map(b=>person(b,false,dep,prop)).join('');
  return `<article class="room" data-id="${dep.id}"><h3>${esc(dep.ar)}</h3><div class="crew">${crew||'<small class="arch">—</small>'}</div></article>`;
}
function person(b,ceo,dep,prop){
  const st=b.status||'up';
  const p=prop?`<i class="prop ${prop}"></i>`:'';
  return `<button type="button" class="guy" data-id="${esc(b.id)}" data-st="${st}"><i class="dot ${st}" title="${bubble(st)}"></i><span class="px${ceo?' crown':''}"><b></b><em></em></span><span class="desk"><i class="mon"></i>${p}</span><small>${esc(b.ar)}</small></button>`;
}
function applyFilter(){
  document.querySelectorAll('#map .guy').forEach(g=>{
    g.classList.toggle('hide',!shown(g.dataset.st));
  });
}
function drawTree(){
  if(!ORG)return;
  let h=`<div class="node"><b>${esc(ORG.owner.ar)}</b></div><div class="node"><b>${esc(ORG.ceo.ar)}</b> · ${esc(ORG.ceo.en)}</div>`;
  ORG.departments.forEach(d=>{
    h+=`<div class="node"><b>${esc(d.ar)}</b>`;
    (d.bots||[]).forEach(b=>{h+=`<div class="sub">${esc(b.ar)}${b.note?' · '+esc(tx(b.note)):''}</div>`;});
    if(!(d.bots||[]).length)h+='<div class="sub">—</div>';
    h+='</div>';
  });
  h+=`<div class="node arch"><b>${esc(ORG.archive.ar)}</b><div class="sub">${esc(tx(ORG.archive.note))}</div></div>`;
  $('#tree').innerHTML=h;
}
function tip(id){
  let bot=null,dep=null;
  if(ORG.ceo.id===id)bot=ORG.ceo;
  ORG.departments.forEach(d=>(d.bots||[]).forEach(b=>{if(b.id===id){bot=b;dep=d;}}));
  if(!bot)return;
  const el=$('#tip');
  const note=tx(bot.note);
  el.innerHTML='<b>'+esc(bot.ar)+'</b><br>'+(dep?esc(dep.ar)+' · ':'')+bubble(bot.status||'up')+(note?' · '+esc(note):'');
  el.style.display='block';
  clearTimeout(tip.t);tip.t=setTimeout(()=>{el.style.display='none';},3500);
}
function startWalk(){
  if(reduce||walker||treeOn)return;
  const pool=[...document.querySelectorAll('.room .guy')].filter(g=>g.dataset.st==='up'&&!g.classList.contains('hide'));
  const hall=document.querySelector('#ceo');
  const map=$('#map');
  if(!pool.length||!hall||!map)return;
  const g=pool[Math.floor(Math.random()*pool.length)];
  const home=g.parentElement;
  const mr=map.getBoundingClientRect(),fr=g.getBoundingClientRect(),mid=hall.getBoundingClientRect();
  const left=fr.left-mr.left,top=fr.top-mr.top;
  const destL=mid.left+mid.width/2-mr.left-fr.width/2;
  const destT=mid.top+mid.height*0.35-mr.top;
  walker={g,home};
  g.classList.add('walk');
  map.appendChild(g);
  g.style.position='absolute';g.style.zIndex='6';g.style.margin='0';
  g.style.left=left+'px';g.style.top=top+'px';
  requestAnimationFrame(()=>{g.style.transition='left 2.2s linear,top 2.2s linear';g.style.left=destL+'px';g.style.top=destT+'px';});
  walker.back=setTimeout(()=>{
    g.style.left=left+'px';g.style.top=top+'px';
    setTimeout(()=>{g.style.transition='';g.style.position='';g.style.left='';g.style.top='';g.style.zIndex='';g.classList.remove('walk');home.appendChild(g);walker=null;},2300);
  },2400);
}

let Dpanel=D,tabName='brief';
function store(){try{return JSON.parse(localStorage.getItem('hq_checks')||'{}');}catch(e){return {};}}
function renderPanel(){
  const p=$('#panel');let h='';
  const brief=Dpanel.brief||{your_part:[],needs_you:[]};
  if(tabName==='brief'){
    const st=store(),key=(brief.date||'')+'|';
    const list=(title,arr,pre)=>{h+='<h2>'+title+'</h2>';if(!arr||!arr.length)h+='<div class="empty">لا يوجد</div>';
      (arr||[]).forEach((t,i)=>{if(privateBlock(t))return;const k=key+pre+i,d=st[k];
        h+='<div class="chk'+(d?' done':'')+'" data-k="'+esc(k)+'"><span class="bx"></span><span>'+esc(t)+'</span></div>';});};
    list('دورك اليوم',brief.your_part,'p');list('يحتاجك',brief.needs_you,'n');
  }else if(tabName==='meeting'){
    const m=Dpanel.meeting||{};h+='<h2>اجتماع الأحد</h2>';
    if(!(m.wins||[]).length)h+='<div class="empty">لا إنجازات محفوظة</div>';
    (m.wins||[]).forEach(w=>{if(!privateBlock(w))h+='<div class="card">'+esc(w)+'</div>';});
  }else if(tabName==='levels'){
    h+='<h2>المستويات</h2>';
    if(ORG)ORG.departments.forEach(d=>(d.bots||[]).forEach(b=>{
      if(!shown(b.status||'up'))return;
      h+='<div class="lv"><span>'+esc(b.ar)+'</span><span>'+esc(bubble(b.status||'up'))+'</span></div>';
    }));
  }else{
    h+='<h2>مكتبة المهارات</h2>';
    const skills=(Dpanel.skills||[]).filter(s=>!privateBlock(s));
    h+=skills.length?skills.map(s=>'<span class="card" style="display:inline-block;margin:2px">'+esc(s)+'</span>').join(''):'<div class="empty">لا توجد مهارات</div>';
  }
  p.innerHTML=h;
  p.querySelectorAll('.chk').forEach(el=>el.onclick=()=>{const s=store();s[el.dataset.k]=!s[el.dataset.k];try{localStorage.setItem('hq_checks',JSON.stringify(s));}catch(e){}renderPanel();});
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tabName=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));renderPanel();});
function tick(){$('#clock').textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});}
setInterval(tick,1000);tick();
addEventListener('message',e=>{
  if(e.data&&e.data.hq){Dpanel=e.data.hq;renderPanel();}
});
function boot(){
  if(parent!==window)parent.postMessage({hqReady:true},location.origin);
  fetch('org.json',{cache:'no-store'}).then(r=>r.json()).then(o=>{ORG=o;drawMap();renderPanel();}).catch(()=>{});
}
let acc=0,last=performance.now();
function frame(t){const dt=Math.min(50,t-last);last=t;if(!reduce){acc+=dt;if(acc>nextWalk){acc=0;nextWalk=2800+Math.random()*1600;startWalk();}}requestAnimationFrame(frame);}
boot();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
