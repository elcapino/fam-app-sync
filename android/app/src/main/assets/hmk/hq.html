<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مقر الشركة الذكي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0c0618;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
#app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#140a28;overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:4px 8px;background:linear-gradient(#241448,#120822);border-top:2px solid #C8102E;border-bottom:1px solid #d4af37}
header h1{font-size:14px;color:#f1d37a;letter-spacing:.3px}
#clock{font-size:14px;font-variant-numeric:tabular-nums;background:#0c0618;border:1px solid #d4af37;padding:2px 8px;border-radius:4px;direction:ltr}
#filters{display:flex;gap:3px;padding:3px 6px;background:#120822;flex:none}
#filters button{flex:1;border:1px solid #5b2d91;border-radius:12px;background:#1c1036;color:#cbb8ee;padding:3px 2px;font:11px system-ui;cursor:pointer}
#filters button.on{background:#d4af37;color:#1e0f3a;border-color:#d4af37}
#stage{flex:1 1 52%;position:relative;background:
  radial-gradient(120% 80% at 50% 0%,#2a1860 0%,#120822 55%,#0c0618 100%);
  overflow:hidden}
#floor{position:absolute;inset:0;display:grid;grid-template-columns:1fr 54px 1fr;gap:3px;padding:3px}
#floor .col{display:flex;flex-direction:column;gap:3px;min-width:0;min-height:0}
.room{flex:1;min-height:0;border:1px solid #d4af3788;border-radius:8px;background:linear-gradient(180deg,#24184acc,#100818ee);padding:3px 4px 4px;display:flex;flex-direction:column;cursor:pointer;box-shadow:inset 0 0 16px #d4af3714}
.room h3{font-size:10px;color:#f1d37a;text-align:center;padding:1px 2px 3px;line-height:1.2;font-weight:700}
.desk{margin-top:auto;height:16px;border-radius:3px;border:1px solid #d4af3755;background:#07040f;position:relative;overflow:hidden}
.desk i{position:absolute;top:2px;bottom:2px;width:42%;background:linear-gradient(90deg,transparent,#7fd0ff88,#d4af37);animation:scan 2.8s linear infinite}
.room.dim .desk i{animation:none;background:#3b1f6b;width:100%;opacity:.45}
.room.bad .desk i{animation:none;background:#ef5b5b;width:100%;opacity:.7}
.spine{border:1px solid #d4af3788;border-radius:8px;background:radial-gradient(circle at 50% 18%,#d4af3733,transparent 42%),linear-gradient(#1a1038,#2a1860);display:flex;align-items:flex-end;justify-content:center}
.spine span{font-size:9px;color:#d4af37;letter-spacing:1px;padding-bottom:4px}
#people{position:absolute;inset:0;pointer-events:none}
.guy{position:absolute;left:0;top:0;width:36px;border:0;background:none;color:#fff;padding:0;pointer-events:auto;cursor:pointer;text-align:center}
.fig{display:block;width:18px;height:24px;margin:0 auto}
.fig b{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto;background:#f6f1e4;box-shadow:0 0 0 1px #d4af37}
.fig em{display:block;width:16px;height:11px;margin:1px auto 0;border-radius:5px 5px 3px 3px;background:linear-gradient(#f1d37a,#a8852a)}
.guy.walk .fig em{animation:step .28s linear infinite}
.guy.st-idle .fig em{background:#4a3d72}
.guy.st-error .fig em{background:#ef5b5b}
.guy.st-wait .fig b{box-shadow:0 0 0 1px #e8a93a,0 0 6px #e8a93a}
.bubble{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:8px;line-height:1.3;background:#0c0618ee;border:1px solid #d4af37;color:#f1d37a;border-radius:8px;padding:0 4px;white-space:nowrap}
.guy small{display:block;font-size:8px;color:#f1d37a;line-height:1.1}
#tip{position:absolute;display:none;background:#140a28;color:#fff;border:1px solid #d4af37;border-radius:8px;padding:6px 8px;font-size:11px;line-height:1.45;max-width:190px;z-index:5;pointer-events:none}
#tip b{color:#f1d37a}
#panel{flex:1 1 auto;min-height:0;overflow:hidden;padding:4px 8px;background:#140a28;font-size:11px}
#tabs{flex:0 0 auto;display:flex;background:#1c1036;border-top:1px solid #d4af37}
#tabs button{flex:1;background:none;border:0;color:#cbb8ee;font:inherit;font-size:11px;padding:6px 2px;cursor:pointer}
#tabs button.on{background:#2a1860;color:#f1d37a;font-weight:700}
footer{flex:0 0 auto;text-align:center;font-size:9px;color:#9a86c4;padding:2px;background:#000}
h2{font-size:12px;color:#d4af37;margin:2px 0 3px}
.chk{display:flex;align-items:center;gap:6px;padding:3px 6px;margin-bottom:2px;background:#1c1036;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid #3d2768}
.chk .bx{flex:0 0 16px;height:16px;border:1px solid #d4af37;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#1e0f3a}
.chk.done{opacity:.6;text-decoration:line-through}
.chk.done .bx{background:#d4af37}
.card{background:#1c1036;border:1px solid #3d2768;border-radius:6px;padding:4px 6px;margin-bottom:3px}
.card .fx{color:#d4af37;margin-top:2px}
.win{color:#9be59b}
.lv{display:flex;align-items:center;gap:6px;margin-bottom:2px;font-size:10px}
.lv .n{flex:0 0 64px;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .bar{flex:1;height:8px;background:#0c0618;border:1px solid #3d2768;border-radius:2px;overflow:hidden}
.lv .bar i{display:block;height:100%;background:linear-gradient(90deg,#a8852a,#d4af37)}
.lv .v{flex:0 0 34px;text-align:left;color:#d4af37;direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#2a1860;border:1px solid #d4af37;color:#fff;padding:2px 6px;border-radius:12px;font-size:10px}
.empty{color:#9a86c4;font-size:11px;padding:4px}
@keyframes scan{from{right:-40%}to{right:110%}}
@keyframes step{50%{transform:skewX(8deg)}}
@media (prefers-reduced-motion:reduce){
  .desk i,.guy.walk .fig em{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <header><h1>مقر الشركة الذكي</h1><div id="clock">--:--</div></header>
  <nav id="filters" aria-label="حالة الفريق"><button data-f="all" class="on">الكل</button><button data-f="working">يعمل الآن</button><button data-f="error">متعطل</button><button data-f="idle">خامل</button></nav>
  <div id="stage">
    <div id="floor"></div>
    <div id="people"></div>
    <div id="tip"></div>
  </div>
  <div id="panel"></div>
  <nav id="tabs">
    <button data-t="brief" class="on">إيجاز الصباح</button>
    <button data-t="meeting">اجتماع الأحد</button>
    <button data-t="levels">المستويات</button>
    <button data-t="skills">مكتبة المهارات</button>
  </nav>
  <footer>HMK made in ALAIN</footer>
</div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const FALLBACK={generated:null,rooms:[],agents:[],skills:[],brief:{your_part:[],needs_you:[]},meeting:{broke:[],wins:[]}};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CANON=[
  {id:'shop',name:'متجر شوبيفاي',aka:['shop','shopify','store','drop']},
  {id:'trade',name:'التداول',aka:['trade','trading','market']},
  {id:'research',name:'البحث',aka:['research','ideas','rnd']},
  {id:'house',name:'مشروع البيت',aka:['house']},
  {id:'fahem',name:'فاهم',aka:['fahem']},
  {id:'meet',name:'غرفة الاجتماعات',aka:['meet','meeting','leadership','ops','agency']}
];
let D=null,filter='all',people=[],walker=null,nextWalk=1200;
function stateOf(a){
  if(!a)return 'idle';
  if(a.status==='fail'||a.status==='error')return 'error';
  if(a.active&&(a.status==='up'||a.status==='ok'||a.status==='working'))return 'working';
  return 'idle';
}
function waitingOn(a){
  if(!D||!a)return false;
  const text=[].concat(D.brief&&D.brief.needs_you||[],D.brief&&D.brief.your_part||[]).join(' ');
  if(a.room==='house'&&/إنارة|بيت|KNX|DALI/.test(text))return true;
  if(a.room==='trade'&&/تداول/.test(text))return true;
  if(a.room==='shop'&&/متجر|تسعير/.test(text))return true;
  if((a.id==='ceo'||a.room==='meet')&&/APK|فحص/.test(text))return true;
  return false;
}
function bubble(a){
  const s=stateOf(a);
  if(s==='error')return 'متعطل';
  if(waitingOn(a))return 'بانتظارك';
  if(s==='working')return 'يعمل';
  return 'خامل';
}
function matches(a){if(!a)return false;if(filter==='all')return true;return stateOf(a)===filter;}
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b));
  $('#tip').style.display='none';
  renderPanel();
});

function setData(data){
  const privateEntry=v=>{const s=String(v==null?'':typeof v==='object'?JSON.stringify(v):v);return /kids|child|study|game|games|أطفال|اطفال|دراسة|لعبة|العاب|ألعاب/i.test(s)};
  D=data||{};D.rooms=(D.rooms||[]).filter(r=>!privateEntry(r));
  D.agents=(D.agents||[]).filter(a=>a&&!privateEntry(a)&&!privateEntry(a.name)&&!privateEntry(a.room)&&!privateEntry(a.id));
  D.skills=(D.skills||[]).filter(s=>!privateEntry(s));
  D.brief=D.brief||{your_part:[],needs_you:[]};
  D.brief.your_part=(D.brief.your_part||[]).filter(x=>!privateEntry(x));
  D.brief.needs_you=(D.brief.needs_you||[]).filter(x=>!privateEntry(x));
  D.meeting=D.meeting||{broke:[],wins:[]};
  D.meeting.broke=(D.meeting.broke||[]).filter(x=>!privateEntry(x));
  D.meeting.wins=(D.meeting.wins||[]).filter(x=>!privateEntry(x));
  const aka=Object.create(null);
  CANON.forEach(c=>c.aka.forEach(a=>{aka[a]=c.id;}));
  D.agents=D.agents.map(a=>{
    if(a.id===D.ceo_id||a.id==='ceo'||a.id==='coo')return {...a,room:'meet'};
    const raw=String(a.room||'').toLowerCase();
    return {...a,room:aka[raw]||'meet'};
  });
  buildOffice();renderPanel();
}
function load(){
  if(parent!==window){parent.postMessage({hqReady:true},location.origin);}
  else{fetch('status.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(s=>setData({generated:s.generated_at,rooms:[],agents:(s.services||[]).map(a=>({...a,room:'meet',active:a.status==='up',last_run:a.last_seen,runs:a.runs,level:null,note:a.evidence})),skills:[],brief:{date:s.generated_at,your_part:[],needs_you:[]},meeting:{week:s.generated_at,broke:[],wins:[]}})).catch(()=>setData(FALLBACK));}
}
addEventListener('message',e=>{
  if(e.data&&e.data.hq&&(e.source===parent||e.source===window)&&(e.origin===location.origin||!e.origin))setData(e.data.hq);
});
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});}
setInterval(tick,1000);tick();

let tab='brief';
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));renderPanel();});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function store(){try{return JSON.parse(localStorage.getItem('hq_checks')||'{}');}catch(e){return{};}}
function saveStore(o){try{localStorage.setItem('hq_checks',JSON.stringify(o));}catch(e){}}
function renderPanel(){
  const p=$('#panel');if(!D)return;let h='';
  if(tab==='brief'){
    const b=D.brief,st=store(),key=(b.date||'')+'|';
    const list=(title,arr,pre)=>{h+='<h2>'+title+'</h2>';
      if(!arr||!arr.length)h+='<div class="empty">لا يوجد</div>';
      (arr||[]).forEach((t,i)=>{const k=key+pre+i,d=st[k];
        h+='<div class="chk'+(d?' done':'')+'" data-k="'+esc(k)+'"><span class="bx">'+(d?'✓':'')+'</span><span>'+esc(t)+'</span></div>';});};
    list('دورك اليوم',b.your_part,'p');list('يحتاجك',b.needs_you,'n');
  }else if(tab==='meeting'){
    const m=D.meeting;h+='<h2>ما الذي تعطل'+(m.week?' — '+esc(m.week):'')+'</h2>';
    if(!(m.broke||[]).length)h+='<div class="empty">لا أعطال</div>';
    (m.broke||[]).forEach(x=>{h+='<div class="card">'+esc(x.what)+'<div class="fx">'+esc(x.fix)+'</div></div>';});
    if((m.wins||[]).length){h+='<h2>الإنجازات</h2>';m.wins.forEach(w=>h+='<div class="card win">'+esc(w)+'</div>');}
  }else if(tab==='levels'){
    h+='<h2>المستويات</h2>';
    D.agents.filter(matches).slice().sort((a,b)=>(b.level||0)-(a.level||0)).forEach(a=>{
      const l=Math.max(1,Math.min(10,a.level||1));
      const raw=String(a.name||a.id||'');
      h+='<div class="lv"><span class="n">'+esc(raw.length>9?raw.slice(0,8)+'…':raw)+'</span><span class="bar"><i style="width:'+l*10+'%"></i></span><span class="v">'+l+'/10</span></div>';});
  }else{
    h+='<h2>مكتبة المهارات</h2><div class="chips">';
    if(!D.skills.length)h+='<div class="empty">لا توجد مهارات</div>';
    D.skills.forEach(s=>h+='<span class="chip">'+esc(s)+'</span>');h+='</div>';
  }
  p.innerHTML=h;
  p.querySelectorAll('.chk').forEach(el=>el.onclick=()=>{const s=store();s[el.dataset.k]=!s[el.dataset.k];saveStore(s);renderPanel();});
}

function buildOffice(){
  if(!D)return;
  const names=Object.create(null);CANON.forEach(c=>{names[c.id]=c.name;});
  const left=['shop','trade','research'], right=['house','fahem','meet'];
  const room=(id)=>{
    const crew=D.agents.filter(a=>a.room===id);
    const st=crew.some(a=>stateOf(a)==='error')?'bad':crew.some(a=>stateOf(a)==='working')?'':'dim';
    return '<article class="room '+st+'" data-id="'+id+'"><h3>'+esc(names[id])+'</h3><div class="desk"><i></i></div></article>';
  };
  $('#floor').innerHTML='<div class="col">'+left.map(room).join('')+'</div><div class="spine"><span>2026</span></div><div class="col">'+right.map(room).join('')+'</div>';
  const hold=$('#people');hold.innerHTML='';people=[];walker=null;
  D.agents.forEach(a=>{
    const el=document.createElement('button');
    el.type='button';el.className='guy st-'+stateOf(a)+(waitingOn(a)?' st-wait':'');
    el.dataset.room=a.room;
    el.innerHTML='<span class="bubble">'+esc(bubble(a))+'</span><span class="fig"><b></b><em></em></span><small>'+esc(a.name||'')+'</small>';
    el.onclick=ev=>{ev.stopPropagation();showTip(a,el);};
    hold.appendChild(el);
    people.push({a,el,x:0,y:0,home:{x:0,y:0},path:null,pi:0,phase:'idle'});
  });
  $('#floor').querySelectorAll('.room').forEach(rm=>rm.onclick=()=>{
    const list=D.agents.filter(a=>a.room===rm.dataset.id);
    const tip=$('#tip');
    tip.innerHTML='<b>'+esc(names[rm.dataset.id])+'</b><br>'+(list.length?list.map(a=>esc(a.name)+' · '+esc(bubble(a))+' · '+(a.level||1)+'/10').join('<br>'):'لا فريق في هذه الغرفة');
    tip.style.display='block';
    const s=$('#stage').getBoundingClientRect(),r=rm.getBoundingClientRect();
    tip.style.left=Math.max(4,Math.min(s.width-tip.offsetWidth-4,r.left-s.left+8))+'px';
    tip.style.top=Math.max(4,r.top-s.top+18)+'px';
  });
  place();
  requestAnimationFrame(()=>requestAnimationFrame(place));
}
function pt(el){
  const s=$('#stage').getBoundingClientRect(),r=el.getBoundingClientRect();
  return {x:r.left-s.left+r.width/2,y:r.top-s.top+r.height*0.55};
}
function place(){
  const meet=document.querySelector('.room[data-id="meet"] .desk');
  people.forEach(p=>{
    const desk=document.querySelector('.room[data-id="'+p.a.room+'"] .desk')||meet;
    if(!desk)return;
    p.home=pt(desk);
    if(p.phase==='idle'){p.x=p.home.x;p.y=p.home.y;}
  });
}
function showTip(a,el){
  const tip=$('#tip');
  tip.innerHTML='<b>'+esc(a.name||a.id)+'</b><br>'+esc(bubble(a))+'<br>المستوى: '+(a.level||1)+'/10'+(a.runs?' · تشغيل '+a.runs:'')+(a.note?'<br>'+esc(a.note):'');
  tip.style.display='block';
  const s=$('#stage').getBoundingClientRect(),r=el.getBoundingClientRect();
  tip.style.left=Math.max(4,Math.min(s.width-150,r.left-s.left))+'px';
  tip.style.top=Math.max(4,r.top-s.top-46)+'px';
  clearTimeout(showTip.t);showTip.t=setTimeout(()=>{tip.style.display='none';},4000);
}
function startWalk(){
  if(reduce||walker)return;
  const pool=people.filter(p=>stateOf(p.a)==='working'&&matches(p.a)&&p.a.room!=='meet');
  if(!pool.length)return;
  const p=pool[Math.floor(Math.random()*pool.length)];
  const meet=document.querySelector('.room[data-id="meet"] .desk');
  const spine=document.querySelector('.spine');
  if(!meet||!spine)return;
  const m=pt(meet),c=pt(spine);
  p.path=[{x:c.x,y:p.home.y},{x:c.x,y:m.y},{x:m.x,y:m.y}];
  p.back=[{x:c.x,y:m.y},{x:c.x,y:p.home.y},{x:p.home.x,y:p.home.y}];
  p.pi=0;p.phase='to';p.el.classList.add('walk');
  walker=p;
}
function step(p,dt){
  if(p.phase==='wait'){p.wait-=dt;if(p.wait<=0){p.phase='back';p.pi=0;}return;}
  const path=p.phase==='back'?p.back:p.path;
  const tg=path&&path[p.pi];
  if(!tg){p.phase='idle';p.el.classList.remove('walk');p.x=p.home.x;p.y=p.home.y;walker=null;return;}
  const dx=tg.x-p.x,dy=tg.y-p.y,d=Math.hypot(dx,dy),sp=70*dt/1000;
  if(d<=sp){p.x=tg.x;p.y=tg.y;p.pi++;
    if(p.pi>=path.length){if(p.phase==='to'){p.phase='wait';p.wait=900;}else{p.phase='idle';p.el.classList.remove('walk');walker=null;}}
  }else{p.x+=dx/d*sp;p.y+=dy/d*sp;}
}
let last=performance.now(),acc=0;
function frame(t){
  const dt=Math.min(50,t-last);last=t;
  if(D&&people.length){
    if(!reduce){acc+=dt;if(!walker&&acc>nextWalk){acc=0;nextWalk=2600+Math.random()*1800;startWalk();}if(walker)step(walker,dt);}
    people.forEach(p=>{
      const on=matches(p.a);
      p.el.style.visibility=on?'visible':'hidden';
      p.el.style.transform='translate('+(p.x-18)+'px,'+(p.y-28)+'px)';
    });
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{if(D)place();});
load();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
