<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>منزل تجريبي — توأم رقمي</title>
<style>
:root{--bg:#0b1220;--panel:#121a2b;--line:#243049;--text:#e8eef8;--muted:#9aa8c0;--accent:#3d7eff;--warn:#e8a838}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
font-family:Tahoma,"Segoe UI",system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
padding:10px 12px;background:linear-gradient(180deg,rgba(11,18,32,.96),rgba(11,18,32,.75));border-bottom:1px solid var(--line)}
#bar h1{margin:0;font-size:15px}
.tag{font-size:11px;color:var(--warn);border:1px solid rgba(232,168,56,.4);background:rgba(232,168,56,.12);
border-radius:999px;padding:3px 8px}
.modes,.tools{display:flex;flex-wrap:wrap;gap:6px}
.modes{margin-inline-start:auto}
button{border:1px solid var(--line);background:#182338;color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#note{position:fixed;top:58px;left:12px;right:12px;z-index:9;display:none;padding:8px 12px;border-radius:8px;
background:rgba(232,168,56,.12);border:1px solid rgba(232,168,56,.4);color:#ffd895;font-size:12px}
#note.show{display:block}
#leg{position:fixed;bottom:48px;right:12px;z-index:8;background:rgba(18,26,43,.92);border:1px solid var(--line);
border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.7;max-width:260px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-start:6px;vertical-align:middle}
#foot{position:fixed;bottom:0;left:0;right:0;z-index:10;text-align:center;font-size:11px;color:var(--muted);
padding:8px;background:rgba(11,18,32,.92);border-top:1px solid var(--line)}
#hint{position:fixed;top:110px;left:12px;z-index:7;font-size:11px;color:var(--muted);background:rgba(18,26,43,.7);
border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#panel{position:fixed;bottom:48px;left:12px;width:min(300px,90vw);z-index:9;display:none;background:rgba(18,26,43,.94);
border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#panel.show{display:block}
#panel h2{margin:0 0 6px;font-size:16px}
#panel .m{color:var(--muted);font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div id="bar">
  <h1>منزل تجريبي — توأم رقمي</h1>
  <span class="tag">عرض عام تجريبي · ليس تصميماً حقيقياً</span>
  <div class="modes">
    <button data-mode="structural" class="on">Structural · الهيكل</button>
    <button data-mode="electrical">Electrical · الكهرباء</button>
    <button data-mode="plumbing">Plumbing · السباكة</button>
    <button data-mode="final">Final · النهائي</button>
  </div>
  <div class="tools">
    <button id="btnCut">قص علوي</button>
    <button id="btnLabels" class="on">تسميات</button>
  </div>
</div>
<div id="note"></div>
<div id="hint">اسحب للتدوير · عجلة للتقريب · انقر فراغاً</div>
<div id="leg">
  <div><span class="sw" style="background:#6ec8ff"></span> كتل شفافة (تجريبي)</div>
  <div><span class="sw" style="background:#f2f4f8"></span> إطار توضيحي</div>
  <div><span class="sw" style="background:#f0a020"></span> كهرباء توضيحية</div>
  <div><span class="sw" style="background:#3a9bff"></span> سباكة توضيحية</div>
  <div style="margin-top:6px;color:var(--warn)">جميع الطبقات توضيحية للعرض فقط</div>
</div>
<div id="panel"><h2 id="pName">—</h2><div class="m" id="pMeta"></div></div>
<div id="foot">Demo House — واجهة عامة مبسّطة ومموّهة · لا تمثل مخططاً أو موقعاً حقيقياً</div>
<canvas id="c"></canvas>
<script src="./app.js"></script>
</body>
</html>
