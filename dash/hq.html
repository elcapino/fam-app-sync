<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HMK · مقر الشركة الذكي · العين</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1e0f3a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
button{font:inherit;color:inherit}
#app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#2a1450;position:relative;overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:linear-gradient(#5b2d91,#3b1f6b);border-bottom:2px solid #d4af37}
header h1{font-size:16px;color:#d4af37}
#clock{font-size:14px;font-variant-numeric:tabular-nums;background:#1e0f3a;border:1px solid #d4af37;padding:1px 8px;border-radius:4px;direction:ltr}
#bar{flex:0 0 auto;padding:5px 8px;background:#2a1450;border-bottom:1px solid #5b2d91}
#q{width:100%;background:#1e0f3a;border:1px solid #5b2d91;border-radius:14px;color:#fff;padding:5px 12px;font:inherit;font-size:13px;outline:0}
#q:focus{border-color:#d4af37}
#fl{display:flex;gap:5px;margin-top:5px;overflow-x:auto}
.fc{flex:0 0 auto;background:#3b1f6b;border:1px solid #5b2d91;border-radius:12px;padding:2px 10px;font-size:11px;cursor:pointer;transition:transform .12s,background .2s}
.fc.on{background:#d4af37;color:#1e0f3a;border-color:#d4af37;font-weight:700}
#stage{flex:0 0 42%;position:relative;background:#1e0f3a;overflow:hidden;touch-action:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{image-rendering:pixelated}
#ov{pointer-events:none}
#reset{position:absolute;top:6px;left:6px;width:32px;height:32px;border-radius:50%;background:#3b1f6bcc;border:2px solid #d4af37;color:#d4af37;font-size:17px;cursor:pointer;z-index:3;display:none}
#panel{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 12px;background:#2a1450}
#tabs{flex:0 0 auto;display:flex;background:#3b1f6b;border-top:2px solid #d4af37}
#tabs button{flex:1;background:none;border:0;color:#cbb8ee;font-size:12px;padding:8px 2px;cursor:pointer;border-inline-start:1px solid #5b2d9166;position:relative;overflow:hidden}
#tabs button.on{background:#5b2d91;color:#d4af37;font-weight:700}
footer{flex:0 0 auto;text-align:center;font-size:9px;color:#9a86c4;padding:2px;background:#1e0f3a}
h2{font-size:13px;color:#d4af37;margin:4px 0 6px;display:flex;justify-content:space-between}
.prog{color:#fff;font-weight:400;font-size:12px;direction:ltr}
.rip{position:relative;overflow:hidden}
.rip i.r{position:absolute;border-radius:50%;background:#d4af3766;transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.tap:active{transform:scale(.96)}
.chk{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:4px;background:#3b1f6b;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid #5b2d91;transition:transform .12s,opacity .3s}
.chk .bx{flex:0 0 18px;height:18px;border:2px solid #d4af37;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#1e0f3a;transition:background .2s}
.chk.done{opacity:.6}.chk.done span:last-child{text-decoration:line-through}
.chk.done .bx{background:#d4af37}
.chk.done .bx::after{content:"✓";animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.card{background:#3b1f6b;border:1px solid #5b2d91;border-radius:6px;padding:7px 9px;margin-bottom:5px;font-size:13px}
.acc{cursor:pointer}
.acc .fx{max-height:0;overflow:hidden;color:#d4af37;font-size:12px;transition:max-height .3s,margin .3s}
.acc.open .fx{max-height:120px;margin-top:5px}
.acc .ar{float:left;transition:transform .3s;color:#d4af37}
.acc.open .ar{transform:rotate(180deg)}
.win{color:#9be59b}
.lv{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;padding:3px 4px;border-radius:5px;cursor:pointer;transition:background .15s,transform .12s}
.lv:active{background:#5b2d91;transform:scale(.98)}
.lv .n{flex:0 0 74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;height:10px;background:#1e0f3a;border:1px solid #5b2d91;border-radius:2px;overflow:hidden;display:flex;justify-content:flex-start;direction:rtl}
.bar i{display:block;height:100%;background:linear-gradient(270deg,#a8852a,#d4af37);transition:width .6s}
.lv .v{flex:0 0 34px;text-align:left;color:#d4af37;direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#5b2d91;border:1px solid #d4af37;color:#fff;padding:4px 10px;border-radius:14px;font-size:12px;cursor:pointer;transition:transform .12s,background .2s}
.chip:active{transform:scale(.93)}
.chip.sm{padding:2px 8px;font-size:11px;cursor:default}
.empty{color:#9a86c4;font-size:12px;padding:6px}
/* sheet */
#back{position:absolute;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#back.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:#2a1450;border-top:3px solid #d4af37;border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;box-shadow:0 -6px 24px #000a}
#sheet.on{transform:translateY(0)}
#sheet.drag{transition:none}
#grab{flex:0 0 auto;padding:8px;cursor:grab;touch-action:none}
#grab::before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:#d4af37;margin:0 auto}
#sb{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 14px 14px}
#sb h3{font-size:17px;color:#d4af37;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role{font-size:12px;color:#cbb8ee;margin:2px 0 8px}
.st{font-size:11px;padding:1px 9px;border-radius:10px;color:#1e0f3a;font-weight:700}
.st.ok{background:#3ecf6e}.st.fail{background:#e03a3a;color:#fff}.st.idle{background:#9a86c4}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed #5b2d9188}
.kv b{color:#d4af37}
.sec{font-size:12px;color:#d4af37;margin:10px 0 4px}
ul.tl{list-style:none}
ul.tl li{font-size:12px;padding:4px 8px;margin-bottom:3px;background:#3b1f6b;border-radius:5px;border-inline-start:3px solid #d4af37}
.out{background:#1e0f3a;border:1px solid #5b2d91;border-radius:6px;padding:8px}
.out .ot{font-weight:700;font-size:13px}.out .od{font-size:10px;color:#9a86c4;margin:2px 0 5px}
.out .ox{max-height:110px;overflow-y:auto;font-size:12px;line-height:1.6;color:#e6dcf7;white-space:pre-wrap}
.li{display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:4px;background:#3b1f6b;border:1px solid #5b2d91;border-radius:6px;font-size:13px;cursor:pointer;transition:transform .12s}
.li:active{transform:scale(.97)}
.li small{color:#cbb8ee;margin-inline-start:auto;font-size:11px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}

#news{flex:0 0 auto;display:flex;align-items:stretch;gap:6px;padding:5px 8px;background:#3b1f6b;border-bottom:1px solid #d4af37;min-height:46px}
#news-body{flex:1;min-width:0;cursor:pointer;text-align:right;display:flex;flex-direction:column;justify-content:center;gap:2px}
#news-kicker{font-size:9px;color:#d4af37}
#news-title{font-size:12px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
#news-meta{font-size:9px;color:#cbb8ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#news-controls{display:flex;flex-direction:row;align-items:center;gap:4px;flex:0 0 auto;z-index:5;position:relative}
#news-controls button{border:1px solid #9564b4;background:#2a1450;color:#f5d77b;border-radius:6px;padding:8px 10px;font-size:12px;cursor:pointer;min-width:40px;min-height:36px;touch-action:manipulation;pointer-events:auto}
#news-body{position:relative;z-index:1}
#note-once{flex:0 0 auto;font-size:9px;line-height:1.5;color:#9a86c4;text-align:center;padding:2px 8px;background:#1e0f3a}
#app{max-width:760px;width:100%}
#stage{flex:0 0 46%;min-height:180px}
html,body{width:100%;overflow:hidden}

</style>
</head>
<body>
<div id="app">
  <header><h1>مقر الشركة الذكي</h1><div id="clock">--:--</div></header>
  <div id="bar"><input id="q" type="search" placeholder="🔍 ابحث بالاسم أو الدور…" autocomplete="off"><div id="fl">
    <button class="fc on" data-f="all">الكل</button><button class="fc" data-f="run">يعمل الآن</button><button class="fc" data-f="fail">متعطل</button><button class="fc" data-f="idle">خامل</button></div></div>
  <div id="stage"><canvas id="cv"></canvas><canvas id="ov"></canvas><button id="reset" title="إعادة">↺</button></div>
  <div id="news" hidden>
    <div id="news-body" role="button" tabindex="0" aria-label="فتح التحديث">
      <div id="news-kicker">آخر التحديثات</div>
      <div id="news-title">بانتظار بيانات المقر…</div>
      <div id="news-meta"></div>
    </div>
    <div id="news-controls">
      <button type="button" id="news-pause" aria-pressed="false" title="إيقاف/تشغيل">❚❚</button>
      <button type="button" id="news-prev" title="السابق" hidden>‹</button>
      <button type="button" id="news-next" title="التالي" hidden>›</button>
    </div>
  </div>
  <div id="note-once">حركة الشخصيات زخرفية فقط · ليست حالة تشغيل حية</div>
  <div id="panel"></div>
  <nav id="tabs">
    <button data-t="brief" class="on rip">إيجاز الصباح</button>
    <button data-t="meeting" class="rip">اجتماع الأحد</button>
    <button data-t="levels" class="rip">المستويات</button>
    <button data-t="skills" class="rip">المهارات</button>
  </nav>
  <footer>HMK made in ALAIN · UAE · نسخة خاصة</footer>
  <div id="back"></div>
  <div id="sheet"><div id="grab"></div><div id="sb"></div></div>
</div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const FALLBACK={generated:null,rooms:[],agents:[],ceo_id:"ceo",brief:{date:"",your_part:[],needs_you:[]},meeting:{week:"",broke:[],wins:[]},skills:[]};
let D=null,gotMsg=false;
let NEWS=[],newsIdx=0,newsPaused=false,newsTimer=null,freezeT=0,pausedFrameDrawn=false;
let query='',filt='all',tab='brief';

/* ---------- data ---------- */
function setData(d,news){
  if(!d||typeof d!=='object')return;
  D=d;D.rooms=D.rooms||[];D.agents=(D.agents||[]).map(a=>Object.assign({skills:[],tasks:[],out:null,active:!!a.active,status:a.status||'idle'},a));
  D.skills=D.skills||[];D.brief=D.brief||{your_part:[],needs_you:[]};D.meeting=D.meeting||{broke:[],wins:[]};
  if(!D.skills.length){const s=new Set();D.agents.forEach(a=>(a.skills||[]).forEach(x=>s.add(x)));D.skills=[...s];}
  if(Array.isArray(news))NEWS=news.filter(x=>x&&(x.title||x.t));
  else if(Array.isArray(d.news))NEWS=d.news.filter(x=>x&&(x.title||x.t));
  buildOffice();renderPanel();renderNews();
  if(openRoom&&!roomsL.find(r=>r.id===openRoom.id))resetView();
}
function emitHqState(){
  const panel=$('#panel');
  try{parent.postMessage({hqState:{tab,newsIdx,query,filter:filt,scrollTop:(document.scrollingElement||document.documentElement).scrollTop||0,panelScroll:panel?panel.scrollTop:0,paused:newsPaused}},location.origin);}catch(e){}
}
window.addEventListener('message',e=>{
  if(e.origin!==location.origin||e.source!==parent||!e.data)return;
  if(e.data.hqRestore){
    const r=e.data.hqRestore;
    if(r.tab){tab=r.tab;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===tab));}
    if(typeof r.newsIdx==='number'){newsIdx=r.newsIdx;}
    if(typeof r.query==='string'){query=r.query;const qi=$('#q');if(qi)qi.value=query;}
    if(typeof r.filter==='string'){filt=r.filter;document.querySelectorAll('.fc').forEach(x=>x.classList.toggle('on',x.dataset.f===filt));}
    renderPanel();
    paintNews();
    const applyScroll=()=>{
      if(typeof r.scrollTop==='number' && r.scrollTop>0){const se=document.scrollingElement||document.documentElement;se.scrollTop=r.scrollTop;}
      const panel=$('#panel');
      if(panel && typeof r.panelScroll==='number'){panel.scrollTop=r.panelScroll;}
    };
    applyScroll();
    requestAnimationFrame(()=>{applyScroll(); setTimeout(applyScroll,40);});
    emitHqState();
    try{parent.postMessage({hqRestoreAck:true,applied:{tab,newsIdx,query,filter:filt,panelScroll:($('#panel')&&$('#panel').scrollTop)||0}},location.origin);}catch(err){}
    return;
  }
  if(!e.data.hq)return;
  gotMsg=true;setData(e.data.hq,e.data.news);emitHqState();
});
try{parent.postMessage({hqReady:true},location.origin);}catch(e){}
/* No offline fake HQ roster. Wait for parent feed. */

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function vib(){try{navigator.vibrate&&navigator.vibrate(10);}catch(e){}}
function hash(s){let h=0;s=String(s);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function fmtTime(s){if(!s)return '—';const d=new Date(s);if(isNaN(d))return String(s);return d.toLocaleString('ar-EG',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function ripple(el,e){const r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,i=document.createElement('i');i.className='r';
  i.style.cssText='width:'+s+'px;height:'+s+'px;left:'+((e.clientX||r.left+r.width/2)-r.left-s/2)+'px;top:'+((e.clientY||r.top+r.height/2)-r.top-s/2)+'px';
  el.appendChild(i);setTimeout(()=>i.remove(),520);}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.rip');if(t)ripple(t,e);},true);
function tick(){$('#clock').textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});}
setInterval(tick,1000);tick();
const ST={ok:'سليم',fail:'فشل',idle:'خامل'};
function stCls(a){return a.status==='fail'?'fail':(a.status==='ok'&&a.active!==false?'ok':'idle');}
function isRunning(a){return a.active&&a.status!=='fail';}
function findAgent(id){return D.agents.find(a=>a.id===id);}

/* ---------- filter ---------- */
function matches(a){
  if(filt==='run'&&!isRunning(a))return false;
  if(filt==='fail'&&a.status!=='fail')return false;
  if(filt==='idle'&&a.status!=='idle')return false;
  if(query){const q=query.toLowerCase();if(!((a.name||'').toLowerCase().includes(q)||(a.role||'').toLowerCase().includes(q)))return false;}
  return true;
}
const filterOn=()=>query||filt!=='all';
$('#q').addEventListener('input',e=>{query=e.target.value.trim();emitHqState();if(typeof renderPanel==='function')renderPanel();});
document.querySelectorAll('.fc').forEach(b=>b.onclick=()=>{vib();filt=b.dataset.f;document.querySelectorAll('.fc').forEach(x=>x.classList.toggle('on',x===b));emitHqState();if(typeof renderPanel==='function')renderPanel();});

/* ---------- panels ---------- */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{vib();
  tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));renderPanel();emitHqState();});
function store(){try{return JSON.parse(localStorage.getItem('hq_checks')||'{}');}catch(e){return{};}}
function saveStore(o){try{localStorage.setItem('hq_checks',JSON.stringify(o));}catch(e){}}
function briefKey(){return 'd:'+((D.brief&&D.brief.date)||new Date().toISOString().slice(0,10))+'|';}

function normalizeDate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'||(/^\d+(\.\d+)?$/.test(String(v).trim()))){
    let n=Number(v); if(!Number.isFinite(n))return null;
    if(n>0&&n<1e11)n*=1000; if(n<1e11)return null;
    const d=new Date(n); return isNaN(d.getTime())?null:d;
  }
  const d=new Date(String(v).trim());
  if(isNaN(d.getTime()))return null;
  if(d.getUTCFullYear()===1970 && !/1970/.test(String(v)) && !/^\d+$/.test(String(v).trim()))return null;
  return d;
}
function fmtNewsDate(s){
  if(!s)return 'تاريخ غير مسجّل';
  const d=normalizeDate(s);
  if(!d){const t=String(s);return (t.length>16?t.slice(0,16):t)+' · ساعة غير موثّقة';}
  try{return new Intl.DateTimeFormat('ar-AE',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)+' · الإمارات';}
  catch(e){return 'تاريخ غير مسجّل';}
}
function newsItem(){return NEWS[newsIdx]||null;}
function paintNews(){
  const wrap=$('#news');if(!wrap)return;
  if(!NEWS.length){wrap.hidden=true;return;}
  wrap.hidden=false;newsIdx=((newsIdx%NEWS.length)+NEWS.length)%NEWS.length;
  const n=NEWS[newsIdx];
  $('#news-kicker').textContent=(n.kind||'تحديث')+(NEWS.length>1?' · '+(newsIdx+1)+'/'+NEWS.length:'');
  $('#news-title').textContent=n.title||n.t||'تحديث محفوظ';
  $('#news-meta').textContent=[n.projectName||n.project||'',fmtNewsDate(n.date||n.m),n.impact||n.note||''].filter(Boolean).join(' · ');
  const long=NEWS.length>1;$('#news-prev').hidden=!long;$('#news-next').hidden=!long;
  $('#news-pause').textContent=newsPaused?'▶':'❚❚';$('#news-pause').setAttribute('aria-pressed',newsPaused?'true':'false');
}
function newsStep(d){if(!NEWS.length)return;newsIdx=(newsIdx+d+NEWS.length)%NEWS.length;paintNews();emitHqState();}
function newsTick(){if(newsPaused||NEWS.length<2)return;newsStep(1);}
function armNews(){clearInterval(newsTimer);newsTimer=setInterval(newsTick,7000);}
function renderNews(){paintNews();armNews();}
function openNews(){const n=newsItem();if(!n)return;try{parent.postMessage({hqOpen:n},location.origin);}catch(e){}}
(function bindNews(){
  const body=$('#news-body'),pause=$('#news-pause'),prev=$('#news-prev'),next=$('#news-next');
  if(!body)return;
  body.onclick=()=>{vib();openNews();};
  body.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openNews();}};
  pause.onclick=()=>{vib();newsPaused=!newsPaused;if(newsPaused){freezeT=performance.now();pausedFrameDrawn=false;}paintNews();emitHqState();};
  prev.onclick=()=>{vib();newsPaused=true;newsStep(-1);};
  next.onclick=()=>{vib();newsPaused=true;newsStep(1);};
})();

function renderPanel(){
  const p=$('#panel');if(!D)return;let h='';
  if(tab==='brief'){
    const b=D.brief,st=store(),key=briefKey();
    const yp=b.your_part||[], ny=b.needs_you||[];
    const total=yp.length+ny.length;
    let done=0;yp.forEach((_,i)=>st[key+'p'+i]&&done++);ny.forEach((_,i)=>st[key+'n'+i]&&done++);
    const list=(title,arr,pre,showP)=>{
      if(!arr||!arr.length)return; // hide empty — do not show misleading 0/0 / لا يوجد
      h+='<h2><span>'+title+'</span>'+(showP&&total?'<span class="prog" id="prog">'+done+'/'+total+'</span>':'')+'</h2>';
      arr.forEach((t,i)=>{const k=key+pre+i,d=st[k];
        h+='<div class="chk'+(d?' done':'')+'" data-k="'+esc(k)+'"><span class="bx"></span><span>'+esc(t)+'</span></div>';});};
    if(!total){h+='<div class="empty">لا بنود إيجاز جاهزة في هذه اللقطة · راجع شريط التحديثات أعلاه لآخر التقارير المؤرشفة</div>';}
    else{list('دورك اليوم',yp,'p',true);list('يحتاجك',ny,'n',false);}
  }else if(tab==='meeting'){
    const m=D.meeting;h+='<h2>ما الذي تعطل'+(m.week?' — '+esc(m.week):'')+'</h2>';
    if(!(m.broke||[]).length)h+='<div class="empty">لا أعطال مسجّلة في هذه اللقطة</div>';
    (m.broke||[]).forEach(x=>{h+='<div class="card acc"><span class="ar">▾</span>⚠ '+esc(x.what)+'<div class="fx">الإصلاح: '+esc(x.fix)+'</div></div>';});
    if((m.wins||[]).length){h+='<h2>الإنجازات</h2>';m.wins.forEach(w=>h+='<div class="card win">★ '+esc(w)+'</div>');}
  }else if(tab==='levels'){
    const list=D.agents.filter(a=>matches(a)).slice().sort((a,b)=>(b.level||0)-(a.level||0));
    h+='<h2>المستويات <span class="prog">'+list.length+'/'+D.agents.length+'</span></h2>';

function buildOffice(){
  if(!D)return;
  const areaY=SKY+2,areaH=H-areaY-2;
  const rooms=D.rooms.slice(),ids=new Set(rooms.map(r=>r.id));
  D.agents.forEach(a=>{if(a.id!==D.ceo_id&&a.room&&!ids.has(a.room)){ids.add(a.room);rooms.push({id:a.room,name:a.room});}});
  rooms.push({id:'__lib',name:'مكتبة المهارات',lib:true});
  const left=[],right=[];rooms.forEach((r,i)=>(i%2===0?left:right).push(r));
  corrW=Math.max(30,Math.floor(W*0.22));
  const sideW=Math.floor((W-corrW-6)/2);
  const byRoom={};D.agents.forEach(a=>{if(a.id===D.ceo_id)return;(byRoom[a.room]=byRoom[a.room]||[]).push(a);});
  roomsL=[];
  // each side stacks rooms; heights weighted by bot count (min 1 row)
  const rowsFor=r=>r.lib?1:Math.max(1,Math.ceil(((byRoom[r.id]||[]).length)/Math.max(1,Math.floor((sideW-4)/16))));
  const place=(arr,x0)=>{
    const wts=arr.map(r=>rowsFor(r)),tot=wts.reduce((s,x)=>s+x,0)||1,gap=2;
    const avail=areaH-(arr.length-1)*gap;let y=areaY;
    arr.forEach((r,i)=>{const h=Math.max(30,Math.floor(avail*wts[i]/tot));
      roomsL.push({id:r.id,name:r.name,lib:!!r.lib,x:x0,y:y,w:sideW,h:h});y+=h+gap;});
  };
  place(left,2);place(right,2+sideW+corrW+2);
  // world bounds grow if rooms overflow
  corrX=2+sideW+1+Math.floor(corrW/2);
  const cdw=Math.min(corrW-4,26);
  ceoDesk={x:corrX-Math.floor(cdw/2),y:areaY+Math.floor(areaH/2)-6,w:cdw,h:10};
  corridorY=ceoDesk.y+ceoDesk.h+8;
  bots=[];librarian=null;
  roomsL.forEach(rm=>{
    if(rm.lib){
      librarian={rm,x:rm.x+8,y:rm.y+rm.h-14,tx:rm.x+8,ty:rm.y+rm.h-14,wait:1500,state:'idle',a:{name:'أمين المكتبة',role:'يرتب الكتب',status:'ok',active:true,kind:'lib'},ph:5};
      return;
    }
    const list=byRoom[rm.id]||[];
    // up to 5 per room: pack into columns/rows that fit; shrink spacing if necessary
    const innerW=rm.w-4,innerH=rm.h-12;
    const maxCols=Math.max(1,Math.floor(innerW/14));
    const cols=Math.min(list.length||1,maxCols);
    const rows=Math.ceil(list.length/cols);
    const cw=Math.floor(innerW/cols),rh=Math.max(14,Math.floor(innerH/Math.max(rows,1)));
    list.forEach((a,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const dx=rm.x+2+col*cw+Math.floor((cw-12)/2),dy=rm.y+14+row*rh;
      const isLeft=rm.x<corrX;
      bots.push({a,rm,desk:{x:dx,y:dy+5,w:12,h:5},hx:dx+3,hy:dy-2,x:dx+3,y:dy-2,ph:hash(a.id)%100,state:'idle',phase:null,doorX:isLeft?rm.x+rm.w:rm.x});
    });
  });
  const ca=D.agents.find(a=>a.id===D.ceo_id)||{id:'ceo',name:'المدير',role:'الرئيس التنفيذي',level:10,runs:0,status:'ok',active:true,note:'',skills:[],tasks:[]};
  ceoBot={a:ca,desk:ceoDesk,hx:ceoDesk.x+Math.floor(ceoDesk.w/2)-3,hy:ceoDesk.y-8,x:0,y:0,ph:7,state:'idle',isCeo:true};
  ceoBot.x=ceoBot.hx;ceoBot.y=ceoBot.hy;bubbles=[];walker=null;

  Object.assign(cam,camT);
}

/* drawing helpers */
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function P(x,y,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),1,1);}
function drawSky(t){
  for(let y=0;y<SKY;y+=2)R(0,y,W,2,y<10?'#2a1450':y<20?'#3b1f6b':'#4a2680');
  for(let i=0;i<14;i++){const sx=(i*37+11)%W,sy=(i*13)%12;if(((t/500|0)+i)%5)P(sx,sy,'#fff');}
  R(W-24,6,7,7,C.gold);R(W-25,7,9,5,C.gold);R(W-23,5,5,9,C.gold);
  ctx.fillStyle='#5b2d91';ctx.beginPath();ctx.moveTo(0,SKY);

  palm(6,26,t,0);palm(W-8,26,t,1);palm(Math.floor(W/2)-30,27,t,2);palm(Math.floor(W/2)+30,27,t,3);
}
function palm(x,y,t,s){
  R(x,y-12,2,12,'#8a5a2b');P(x+1,y-6,'#6b4220');
  const sw=Math.round(Math.sin(t/700+s)),g='#2f9e5a',g2='#1f7a42';
  R(x-5+sw,y-13,5,1,g);R(x+2+sw,y-13,5,1,g);R(x-4,y-14,3,1,g2);R(x+3,y-14,3,1,g2);R(x-1,y-15,4,1,g);R(x,y-16,2,1,g2);
}
function drawRoom(rm){

  for(let yy=rm.y+8;yy<rm.y+rm.h-1;yy+=4)for(let xx=rm.x+1;xx<rm.x+rm.w-1;xx+=4)if(((xx-rm.x)/4+(yy-rm.y)/4)%2<1)R(xx,yy,4,4,'#52298a');

function shelfXs(rm){const n=Math.max(2,Math.floor((rm.w-6)/18));const arr=[];for(let i=0;i<n;i++)arr.push(rm.x+3+Math.floor(i*(rm.w-6)/n));return {xs:arr,w:Math.floor((rm.w-6)/n)-2};}

function drawDesk(d,big,active,t,ph){

function drawBot(b,t,dim){

/* walking */
let walker=null,nextWalk=2500,acc=0;
function recentOK(b){return !!(b&&b.a&&b.a.status!=='fail'); /* visual motion only */}
function startWalk(){
  if(walker)return;
  const cand=bots.filter(recentOK);if(!cand.length)return;
  const b=cand[Math.floor(Math.random()*cand.length)],left=b.rm.x<corrX;
  const doorY=b.rm.y+b.rm.h-8,dx=left?(b.rm.x+b.rm.w+3):(b.rm.x-3);
  const tx=ceoBot.x+(left?-9:9),ty=ceoBot.y+3;
  b.path=[{x:b.hx,y:doorY-3},{x:dx,y:doorY-3},{x:dx,y:corridorY},{x:tx,y:corridorY},{x:tx,y:ty}];
  b.back=[{x:tx,y:corridorY},{x:dx,y:corridorY},{x:dx,y:doorY-3},{x:b.hx,y:doorY-3},{x:b.hx,y:b.hy}];
  b.pi=0;b.state='walk';b.phase='to';walker=b;
}
function stepWalk(b,dt){
  if(b.phase==='wait'){b.wait-=dt;if(b.wait<=0){b.phase='from';b.pi=0;b.state='walk';}return;}
  const path=b.phase==='to'?b.path:b.back,tg=path[b.pi];if(!tg)return;
  const sp=22*dt/1000,dx=tg.x-b.x,dy=tg.y-b.y,d=Math.hypot(dx,dy);
  if(d<=sp){b.x=tg.x;b.y=tg.y;b.pi++;
    if(b.pi>=path.length){
      if(b.phase==='to'){b.phase='wait';b.wait=1400;b.state='idle';bubbles.push({x:()=>b.x+3,y:()=>b.y-5,s:'✓',c:C.grn,until:performance.now()+1300});}
      else{b.state='idle';b.phase=null;b.x=b.hx;b.y=b.hy;walker=null;}
    }
  }else{b.x+=dx/d*sp;b.y+=dy/d*sp;}
}
function stepLib(dt){
  const l=librarian;if(!l)return;
  if(l.state==='walk'){
    const sp=10*dt/1000,dx=l.tx-l.x,d=Math.abs(dx);
    if(d<=sp){l.x=l.tx;l.state='idle';l.wait=2000+Math.random()*3000;}else l.x+=Math.sign(dx)*sp;
  }else{l.wait-=dt;if(l.wait<=0){const s=shelfXs(l.rm);const x=s.xs[Math.floor(Math.random()*s.xs.length)]+Math.floor(s.w/2)-3;l.tx=x;l.state='walk';}}
  l.isLib=true;

/* camera */
function clampCam(c){
  const vw=W/c.z,vh=H/c.z;
  c.x=vw>=W?(W-vw)/2:Math.max(0,Math.min(W-vw,c.x));
  c.y=vh>=H?(H-vh)/2:Math.max(0,Math.min(H-vh,c.y));
  c.z=Math.max(1,Math.min(5,c.z));
}
function focusRoom(rm){
  openRoom=rm;const pad=4,z=Math.min(W/(rm.w+pad*2),H/(rm.h+pad*2),4);
  camT.z=Math.max(1,z);camT.x=rm.x+rm.w/2-W/camT.z/2;camT.y=rm.y+rm.h/2-H/camT.z/2;clampCam(camT);
  $('#reset').style.display='block';
}
function resetView(){openRoom=null;camT.x=0;camT.y=0;camT.z=1;$('#reset').style.display='none';closeSheet();}
$('#reset').onclick=()=>{vib();resetView();};
function toWorld(cx,cy){const r=stage.getBoundingClientRect();return {x:(cx-r.left)/r.width*W/cam.z+cam.x,y:(cy-r.top)/r.height*H/cam.z+cam.y};}
function zoomAt(cx,cy,nz){
  const w=toWorld(cx,cy);nz=Math.max(1,Math.min(5,nz));
  const r=stage.getBoundingClientRect();
  camT.z=nz;camT.x=w.x-(cx-r.left)/r.width*W/nz;camT.y=w.y-(cy-r.top)/r.height*H/nz;clampCam(camT);
  cam.z=camT.z;cam.x=camT.x;cam.y=camT.y;
}

/* gestures */
const ptrs=new Map();let g={moved:false,sx:0,sy:0,pd:0,pz:1,t:0};
stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){g.moved=false;g.sx=e.clientX;g.sy=e.clientY;g.t=performance.now();}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];g.pd=Math.hypot(a.x-b.x,a.y-b.y);g.pz=camT.z;g.moved=true;}
});
stage.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const ox=p.x,oy=p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(g.pd>0)zoomAt((a.x+b.x)/2,(a.y+b.y)/2,g.pz*d/g.pd);
  }else if(ptrs.size===1){
    if(!g.moved&&Math.hypot(e.clientX-g.sx,e.clientY-g.sy)>8)g.moved=true;
    if(g.moved){
      const r=stage.getBoundingClientRect();
      camT.x-=(e.clientX-ox)/r.width*W/camT.z;camT.y-=(e.clientY-oy)/r.height*H/camT.z;clampCam(camT);
      cam.x=camT.x;cam.y=camT.y;
    }
  }
});
function up(e){
  const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(had&&!g.moved&&ptrs.size===0&&e.type==='pointerup')onTap(e.clientX,e.clientY);
  if(ptrs.size===1){const q=[...ptrs.values()][0];g.sx=q.x;g.sy=q.y;}
}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,camT.z*(e.deltaY<0?1.15:1/1.15));},{passive:false});

let tagBot=null,tagUntil=0;
function onTap(cx,cy){
  vib();const w=toWorld(cx,cy);
  let best=null,bd=1e9;
  bots.concat(ceoBot?[ceoBot]:[]).forEach(b=>{const d=Math.hypot(w.x-(b.x+3),w.y-(b.y+4));if(d<bd){bd=d;best=b;}});
  const thr=Math.max(5,11/cam.z);
  if(best&&bd<thr){
    if(!(openRoom&&best.rm&&best.rm.id===openRoom.id)&&!best.isCeo&&cam.z<1.5){tagBot=best;tagUntil=performance.now()+2200;}
    openAgent(best.a.id);return;
  }
  if(librarian&&Math.hypot(w.x-(librarian.x+3),w.y-(librarian.y+4))<thr){tagBot=librarian;tagUntil=performance.now()+2200;return;}
  const rm=roomsL.find(r=>w.x>=r.x&&w.x<=r.x+r.w&&w.y>=r.y&&w.y<=r.y+r.h);
  if(rm){focusRoom(rm);if(rm.lib){openSkillsLib();}else{openRoomSheet(rm);try{parent.postMessage({hqRoom:rm.id,hqRoomName:rm.name},location.origin);}catch(e){}}}
}
function openSkillsLib(){
  openSheet('<h3>📚 مكتبة المهارات</h3><div class="role">اختر مهارة لرؤية من يستخدمها</div><div class="chips">'+
    (D.skills.length?D.skills.map(s=>'<button class="chip" data-s="'+esc(s)+'">'+esc(s)+'</button>').join(''):'<div class="empty">لا توجد مهارات</div>')+'</div>');
  sb.querySelectorAll('.chip[data-s]').forEach(el=>el.onclick=()=>{vib();openSkill(el.dataset.s);});
}

/* overlay (crisp text) */
function drawOverlay(t){
  octx.setTransform(1,0,0,1,0,0);octx.clearRect(0,0,ov.width,ov.height);
  octx.setTransform(DPR,0,0,DPR,0,0);
  const sx=cssW/W*cam.z,sy=cssH/H*cam.z;
  const X=x=>(x-cam.x)*sx,Y=y=>(y-cam.y)*sy;
  octx.textAlign='center';octx.textBaseline='middle';octx.direction='rtl';
  const lab=(s,x,y,col,fs)=>{octx.font='bold '+fs+'px system-ui,Tahoma,Arial';octx.lineWidth=3;octx.strokeStyle='#1e0f3a';octx.strokeText(s,x,y);octx.fillStyle=col;octx.fillText(s,x,y);};
  roomsL.forEach(rm=>{
    const dim=filterOn()&&!rm.lib&&!bots.some(b=>b.rm===rm&&matches(b.a));
    octx.globalAlpha=dim?0.4:1;
    lab(rm.name,X(rm.x+rm.w/2),Y(rm.y+4),'#fff',Math.max(10,Math.min(14,3.6*sx)));
  });
  octx.globalAlpha=1;
  lab('المدير',X(ceoDesk.x+ceoDesk.w/2),Y(ceoDesk.y+ceoDesk.h+14),C.gold,Math.max(9,Math.min(13,3*sx)));
  const focused=openRoom;
  const all=bots.concat([ceoBot]);
  all.forEach(b=>{
    const showName=(focused&&b.rm&&b.rm.id===focused.id)||cam.z>=2.4;
    const x=X(b.x+3),y=Y(b.y+10);
    if(showName){lab(b.a.name.length>10?b.a.name.slice(0,9)+'…':b.a.name,x,y+3,'#fff',Math.max(9,Math.min(12,2.6*sx)));}
    else if(!b.isCeo){const tg=(b.a.name||'?').replace(/\s/g,'').slice(0,2);lab(tg,x,y,'#ffffffcc',Math.max(7,Math.min(9,2*sx)));}
    if(tagBot===b&&performance.now()<tagUntil&&!showName)lab(b.a.name,x,y+10,C.gold,11);
  });
  if(librarian){const x=X(librarian.x+3),y=Y(librarian.y+10);
    if(tagBot===librarian&&performance.now()<tagUntil)lab('أمين المكتبة',x,y+3,C.gold,11);else if(cam.z>=2.4)lab('أمين المكتبة',x,y+3,'#fff',10);}
  // gold pulse rings
  if(filterOn()){
    const k=(t%1100)/1100;
    all.forEach(b=>{if(!matches(b.a))return;
      octx.strokeStyle='rgba(212,175,55,'+(1-k).toFixed(2)+')';octx.lineWidth=2;
      octx.beginPath();octx.arc(X(b.x+3),Y(b.y+4),(5+k*7)*sx*0.6+3,0,6.283);octx.stroke();
      octx.strokeStyle='#d4af37';octx.lineWidth=1.5;octx.beginPath();octx.arc(X(b.x+3),Y(b.y+4),5*sx*0.6+2,0,6.283);octx.stroke();});
  }
}

/* main loop */
let last=performance.now();
function frame(t){
  const dt=Math.min(100,t-last);last=t;
  if(!D||!ceoBot){requestAnimationFrame(frame);return;}
  // shared pause flag: freeze scene motion + news ticker already gated
  if(newsPaused){
    if(pausedFrameDrawn){requestAnimationFrame(frame);return;}
    pausedFrameDrawn=true;
    const ft=freezeT||t;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle=C.dk;ctx.fillRect(0,0,W,H);
    ctx.setTransform(cam.z,0,0,cam.z,-cam.x*cam.z,-cam.y*cam.z);
    drawSky(ft);R(0,SKY,W,H-SKY,C.dk);
    roomsL.forEach(drawRoom);
    const cw=corrW;
    R(corrX-Math.floor(cw/2)-1,SKY+2,cw+2,H-SKY-4,'#3b1f6b');
    for(let y=SKY+4;y<H-2;y+=6)R(corrX-1,y,2,3,'#5b2d91');
    R(corrX-Math.floor(cw/2)-1,SKY+2,1,H-SKY-4,C.gold);R(corrX+Math.floor(cw/2)+1,SKY+2,1,H-SKY-4,C.gold);
    bots.forEach(b=>drawDesk(b.desk,false,b.a.active,ft,b.ph));
    drawDesk(ceoDesk,true,true,ft,3);
    const all=bots.concat([ceoBot]);if(librarian)all.push(librarian);
    all.sort((a,b)=>a.y-b.y).forEach(b=>drawBot(b,ft,b.a.kind!=='lib'&&filterOn()&&!matches(b.a)));
    ctx.setTransform(1,0,0,1,0,0);
    drawOverlay(ft);
    requestAnimationFrame(frame);return;
  }
  // smooth camera
  const k=1-Math.pow(0.001,dt/1000);
  if(ptrs.size===0){cam.x+=(camT.x-cam.x)*k;cam.y+=(camT.y-cam.y)*k;cam.z+=(camT.z-cam.z)*k;}
  acc+=dt;if(!walker&&acc>nextWalk){acc=0;nextWalk=3500+Math.random()*2500;startWalk();}
  if(walker)stepWalk(walker,dt);
  stepLib(dt);
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle=C.dk;ctx.fillRect(0,0,W,H);
  ctx.setTransform(cam.z,0,0,cam.z,-cam.x*cam.z,-cam.y*cam.z);
  drawSky(t);R(0,SKY,W,H-SKY,C.dk);
  roomsL.forEach(drawRoom);
  const cw=corrW;
  R(corrX-Math.floor(cw/2)-1,SKY+2,cw+2,H-SKY-4,'#3b1f6b');
  for(let y=SKY+4;y<H-2;y+=6)R(corrX-1,y,2,3,'#5b2d91');
  R(corrX-Math.floor(cw/2)-1,SKY+2,1,H-SKY-4,C.gold);R(corrX+Math.floor(cw/2)+1,SKY+2,1,H-SKY-4,C.gold);
  R(ceoDesk.x-3,ceoDesk.y-10,ceoDesk.w+6,ceoDesk.h+22,'#6a2a8a');R(ceoDesk.x-2,ceoDesk.y-9,ceoDesk.w+4,ceoDesk.h+20,'#7a35a0');
  bots.forEach(b=>drawDesk(b.desk,false,b.a.active,t,b.ph));
  drawDesk(ceoDesk,true,true,t,3);
  const all=bots.concat([ceoBot]);if(librarian)all.push(librarian);
  all.sort((a,b)=>a.y-b.y).forEach(b=>drawBot(b,t,b.a.kind!=='lib'&&filterOn()&&!matches(b.a)));
  bots.forEach(b=>{if(b.a.status==='fail'){const kk=Math.round(Math.sin(t/250+b.ph));bubble(b.x+3,b.y-5+kk,'!',C.red);}});
  const now=performance.now();bubbles=bubbles.filter(q=>q.until>now);bubbles.forEach(q=>bubble(q.x(),q.y(),q.s,q.c));
  ctx.setTransform(1,0,0,1,0,0);
  drawOverlay(t);
  requestAnimationFrame(frame);
}
resize();requestAnimationFrame(frame);
})();
</script>
