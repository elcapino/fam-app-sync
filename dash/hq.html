<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#170e24;color:#fff;font-family:Tahoma,Arial,system-ui}button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:-3px}
#app{height:100dvh;max-width:600px;margin:auto;display:flex;flex-direction:column;background:#261334;overflow:hidden}
header{height:52px;flex:none;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;background:#5B2C83;border-top:4px solid #C8102E;border-bottom:3px solid #00843D}
h1{font-size:16px;margin:0;color:#f4d994}header small{font-size:9px;color:#eadff2;display:block;margin-top:2px}
#clock{font-size:12px;direction:ltr;font-variant-numeric:tabular-nums}
#lead{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:5px 7px;flex:none;background:#1b1028;border-bottom:1px solid #5a3a70}
#lead .card{background:#382046;border:1px solid #77568c;border-radius:8px;padding:4px 6px;font-size:9px;line-height:1.35;min-height:42px}
#lead b{display:block;color:#e1bd65;font-size:10px}
#filters{display:flex;gap:4px;padding:5px 7px;flex:none;background:#1b1028}
#filters button{flex:1;border:1px solid #77568c;background:#382046;border-radius:12px;padding:5px 0;font-size:10px}
#filters .on{background:#e1bd65;border-color:#e1bd65;color:#21112e}
.floor{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.strip{display:flex;justify-content:space-between;align-items:center;flex:none;height:24px;padding:0 8px;font-size:10px;background:#3c224d;color:#ead69d}.strip b{font-size:11px}
#stage{position:relative;flex:1;min-height:0;background:#1e0f3a;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#offices{position:absolute;inset:0}
.office{position:absolute;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;text-shadow:0 1px #000}
.sign{background:#2c163eeF;border:1px solid #edcf89;border-radius:2px;color:#fff;font-weight:bold;font-size:11px;padding:3px 2px;line-height:1.15;min-height:22px;display:flex;align-items:center;justify-content:center;gap:4px}
.subsign{background:#201226ed;border:1px solid #a7834a;font-size:8px;padding:2px 2px;color:#f0ddbc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c6a264;flex:none;box-shadow:0 0 0 2px #18101e}.dot.up{background:#45e086}.dot.error{background:#ff5264}
.office.dim{opacity:.38}.office:hover .sign{background:#5B2C83}
#marketNav,.pager{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;padding:4px 8px;background:#251430;font-size:10px;min-height:28px}
button.nav{border:1px solid #9c7a42;background:#4a2a61;border-radius:5px;padding:3px 10px;font-size:10px}button:disabled{opacity:.35;cursor:default}
#panel{height:168px;flex:none;display:flex;flex-direction:column;padding:6px 8px;gap:4px;overflow:hidden;background:#21132e}
#panel h2{margin:0;color:#e7c777;font-size:11px}
.rows{min-height:0;flex:1;overflow:hidden}
.row{border:1px solid #65427b;background:#392147;border-radius:4px;padding:5px 6px;margin-bottom:3px;font-size:10px;line-height:1.45;overflow-wrap:anywhere}
.row strong{color:#ecd297}.row .meta{color:#c6b2d1;font-size:9px}
#tabs{display:flex;flex:none;background:#432258;border-top:1px solid #b99350}
#tabs button{flex:1;background:none;border:0;font-size:9px;padding:7px 1px;color:#ddd0e5;line-height:1.2}
#tabs .on{background:#5B2C83;color:#f9d77c}
footer{flex:none;background:#08080a;text-align:center;color:white;font-size:10px;padding:4px;direction:ltr}
#detail{display:none;position:absolute;inset:0;background:#241330;z-index:5;flex-direction:column;overflow:hidden;padding:8px;gap:6px}
#detail.open{display:flex}
.detailhead{display:flex;align-items:center;gap:8px;flex:none;border-bottom:2px solid #b69252;padding-bottom:6px}
.detailhead h2{font-size:15px;color:#ecd297;margin:0;overflow-wrap:anywhere}.detailhead small{font-size:9px;color:#d1bdde}
#detailRows{flex:1;min-height:0;overflow:hidden}#detail .row{padding:7px;font-size:11px;line-height:1.55}
#detail .pager{border:1px solid #76518c;border-radius:5px}.source{font-size:9px;color:#bcacc8}
#emptyFilter{display:none;position:absolute;bottom:3px;left:16px;right:16px;text-align:center;background:#281631ef;border:1px solid #c5a365;padding:4px;font-size:10px;pointer-events:none}
.cmdbox{display:flex;flex-direction:column;gap:4px;height:100%}
.cmdbox textarea{width:100%;min-height:52px;resize:none;border:1px solid #9c7a42;border-radius:6px;background:#2a1838;padding:6px;font-size:11px}
.cmdbox .actions{display:flex;gap:5px}.cmdbox .actions button{flex:1;border:1px solid #9c7a42;background:#4a2a61;border-radius:6px;padding:5px;font-size:10px}
.cmdbox .note{font-size:9px;color:#c6b2d1;line-height:1.4}
@media(max-height:650px){header{height:44px}#panel{height:130px}#lead{display:none}#tabs button{padding:5px 0}.sign{font-size:9px;padding:2px}.subsign{font-size:7px}}
</style>
<div id="app">
<header><div><h1>مقر شركة HMK</h1><small>CEO · COO · أقسام · Pixel HQ</small></div><div id="clock"></div></header>
<div id="lead" aria-label="القيادة">
  <div class="card"><b>CEO</b><span id="leadCeo">Grok · تخطيط وتوجيه</span></div>
  <div class="card"><b>COO</b><span id="leadCoo">يشرف على البرامج والمشاريع</span></div>
  <div class="card"><b>خبير أوامر + جودة</b><span id="leadQx">تدقيق الأوامر · تقييمات موثقة</span></div>
</div>
<nav id="filters" aria-label="تصفية الحالة"><button class="on" data-f="all">الكل</button><button data-f="working">يعمل الآن</button><button data-f="error">متعطل</button><button data-f="idle">غير مؤكد</button></nav>
<main class="floor">
<div class="strip"><b>مقر HMK · مكاتب وأقسام</b><span id="count">قراءة السجل…</span></div><div class="strip" style="height:18px;font-size:8px;opacity:.85"><b>حركة بكسل زخرفية فقط</b><span>لا تمثّل حضور موظف أو حالة اتصال</span></div>
<div id="stage"><canvas id="cv" aria-hidden="true"></canvas><div id="offices"></div><div id="emptyFilter">لا سجلات تطابق هذا المرشح</div></div>
<div id="marketNav"></div>
<section id="panel"><h2 id="panelTitle"></h2><div id="panelRows" class="rows"></div><div id="panelNav" class="pager"></div></section>
<nav id="tabs">
  <button class="on" data-t="brief">إيجاز</button>
  <button data-t="eval">تقييمات</button>
  <button data-t="compare">اليوم/أمس</button>
  <button data-t="cmd">أوامر</button>
  <button data-t="ideas">أفكار</button>
</nav>
<section id="detail" aria-label="تفاصيل القسم"><div class="detailhead"><button class="nav" id="back">رجوع</button><div><h2 id="detailTitle"></h2><small id="detailSub"></small></div></div><div id="detailRows"></div><div class="pager" id="detailNav"></div><div class="source" id="detailSource"></div></section>
</main><footer>HMK made in ALAIN</footer></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let feed={rooms:[],agents:[],skills:[]},services=[],company=null,ideasLocal=null,offices=[],visible=[],filter='all',marketPage=0,panelPage=0,detailPage=0,tab='brief',selected=null,language=new URLSearchParams(location.search).get('lang')||'ar',statusGenerated=null,cmdDraft='';
const privateEntry=a=>/kids|child|study|أطفال|اطفال|دراسة/i.test(String(a.id||'')+' '+String(a.room||'')+' '+String(a.name||'')+' '+String(a.name_ar||''));
const isRole=a=>a&&(a.kind==='role'||a.probe==='organization_unverified'||a.record_type==='role');
const isTool=a=>a&&(a.kind==='tool'||a.record_type==='tool'||(!isRole(a)&&(a.cap!=null||a.unit||/^service:/.test(String(a._officeKey||'')))));
/* Tools only get up/error from authenticated probes; roles never inherit tool health. */
const state=a=>{
 if(!a)return 'idle';
 if(isRole(a))return 'idle'; /* دور مسجل / organization_unverified — never green from linked service */
 if(/^(fail|error|down|failed)$/i.test(a.status))return 'error';
 if(/^(up|ok|working|running)$/i.test(a.status)&&a.probe!=='organization_unverified')return 'up';
 return 'idle';
};
const statusName=a=>{
 if(isRole(a))return language==='en'?'Registered role · unverified':'دور مسجل · غير مُختبَر';
 if(state(a)==='error')return 'متعطل';
 if(state(a)==='up')return 'يعمل / سليم';
 if(a&&a.status==='idle')return 'خامل موثّق';
 return 'غير مؤكد';
};
const matches=a=>filter==='all'||(filter==='working'?state(a)==='up'&&!isRole(a):filter==='idle'?(state(a)==='idle'||isRole(a)):state(a)==='error');
const display=a=>language==='en'?(a.name_en||a.name||a.id):(a.name_ar||a.name||a.id);
const fmt=v=>typeof v==='object'?JSON.stringify(v):String(v);
function time(v){if(!v)return 'غير مسجل';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString(language==='en'?'en-GB':'ar-AE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function rebuild(){
 const agents=(feed.agents||[]).filter(a=>!privateEntry(a));
 const usedToolIds=new Set();
 offices=[];
 const depts=(company&&company.departments)||[];
 /* 1) company.departments first — roles + covered tools grouped, roles never take tool green */
 depts.forEach(dep=>{
  const records=[];
  (company.leadership||[]).filter(p=>(dep.covers||[]).includes(p.id)).forEach(p=>{
   records.push({
     id:p.id,name:p.name_ar,name_ar:p.name_ar,name_en:p.name_en,
     role:language==='en'?p.role_en:p.role_ar,kind:'role',record_type:'role',
     probe:'organization_unverified',status:'organization_unverified',
     evidence:'دور تنظيمي مسجّل · لا يُشتق من حالة أداة مرتبطة',
     note:p.note,_source:'local-data/company.json'
   });
  });
  (dep.covers||[]).forEach(cid=>{
   const svc=services.find(s=>s.id===cid);
   if(svc&&!privateEntry(svc)){usedToolIds.add(svc.id);records.push({...svc,kind:'tool',record_type:'tool',_source:'status.json'});}
   agents.filter(a=>a.id===cid||a.room===dep.id).forEach(a=>{if(!records.some(r=>r.id===a.id))records.push({...a,_source:'hq payload'});});
  });
  offices.push({id:dep.id,key:'dept:'+dep.id,name:dep.name_ar,name_ar:dep.name_ar,name_en:dep.name_en,records});
 });
 /* 2) remaining feed rooms not mapped */
 const mapped=new Set(offices.map(o=>o.id));
 (feed.rooms||[]).filter(a=>!privateEntry(a)&&!mapped.has(a.id)).forEach(r=>{
  offices.push({...r,key:'room:'+r.id,records:agents.filter(a=>a.room===r.id).map(a=>({...a,_source:'hq payload'}))});
 });
 /* 3) standalone tools last */
 services.filter(a=>!privateEntry(a)&&!usedToolIds.has(a.id)).forEach(s=>{
  if(offices.some(o=>o.records.some(a=>a.id===s.id)))return;
  offices.push({id:s.id,key:'service:'+s.id,name:s.name,name_ar:s.name_ar||s.name,name_en:s.name_en||s.name,records:[{...s,kind:'tool',record_type:'tool',_source:'status.json'}]});
 });
 render();
}
function dot(a){return '<i class="dot '+(isRole(a)?'idle':state(a))+'" title="'+(isRole(a)?'role probe organization_unverified':'')+'"></i>';}
function row(label,value){return '<div class="row"><strong>'+esc(label)+'</strong><div>'+esc(value)+'</div></div>';}
function pager(el,page,total,go){el.innerHTML='<button class="nav" '+(page===0?'disabled':'')+'>السابق</button><span dir="ltr">'+(page+1)+' / '+total+'</span><button class="nav" '+(page>=total-1?'disabled':'')+'>التالي</button>';el.firstChild.onclick=()=>go(page-1);el.lastChild.onclick=()=>go(page+1);}
function paginate(el,html,page,nav,go){
 el.innerHTML='';const holder=document.createElement('div');holder.innerHTML=html;
 const queue=[],budget=el.clientHeight;
 [...holder.children].forEach(n=>{
  el.innerHTML=n.outerHTML;
  if(el.scrollHeight<=budget){queue.push(n.outerHTML);return;}
  const label=n.querySelector('strong')?.textContent||'سجل',words=(n.querySelector('strong')?n.lastElementChild.textContent:n.textContent).split(/\s+/);let part='';
  words.forEach(w=>{el.innerHTML=row(label,part+(part?' ':'')+w);if(el.scrollHeight>budget&&part){queue.push(row(label,part));part=w;}else part+=(part?' ':'')+w;});
  if(part)queue.push(row(label,part));
 });
 el.innerHTML='';const pages=[[]];
 queue.forEach(h=>{el.insertAdjacentHTML('beforeend',h);if(el.scrollHeight>budget&&pages.at(-1).length){pages.push([]);el.innerHTML=h;}pages.at(-1).push(h);});
 page=Math.max(0,Math.min(page,pages.length-1));el.innerHTML=pages[page].join('');pager(nav,page,pages.length,go);return page;
}
function channelRows(){
 const ch=(company&&company.channels)||[];
 let html='';
 ch.forEach(c=>{
  const title=language==='en'?(c.name_en||c.id):(c.name_ar||c.id);
  const st=c.connected?(c.mode==='local_draft'?'مسودة محلية فقط':'موثّق'):'يحتاج ربط';
  html+='<div class="row"><strong>'+esc(title)+' · '+esc(st)+'</strong><div class="meta">'+esc(c.owner_channel||'')+(c.project_note?' · '+c.project_note:'')+'</div></div>';
 });
 if(!html)html=row('القنوات','لا بيانات قنوات محلية');
 return html;
}
function panel(){
 let html='',title='';
 const records=offices.flatMap(s=>s.records).filter(matches);
 if(tab==='brief'){
  title='إيجاز المقر · عبر CEO فقط';
  const b=feed.brief||{};
  [...(b.your_part||[]),...(b.needs_you||[])].forEach(v=>html+=row('من إيجاز المقر',v));
  if(company){
   html+=row('قاعدة التقارير','كل التقارير النهائية تمر عبر CEO فقط · لا تجاوز للأقسام');
   html+=row('COO','يشرف على البرامج والمشاريع · التوزيع بعد تدقيق خبير الأوامر');
   (company.channels||[]).slice(0,2).forEach(c=>html+=row(c.name_ar,c.owner_channel));
  }
  if(!html){records.slice(0,6).forEach(a=>html+='<div class="row">'+dot(a)+' <strong>'+esc(display(a))+'</strong> · '+esc(statusName(a))+'<div class="meta">'+esc(a.evidence||a.note||a.role||'من السجل المحلي')+'</div></div>');}
 }else if(tab==='eval'){
  title='تقييمات موثقة · موظفين وأدوات';
  const ev=(company&&company.evaluations)||[];
  if(ev.length){
   ev.forEach(e=>{
    html+='<div class="row">'+dot({status:e.raw_status})+' <strong>'+esc(e.name)+'</strong> · '+esc(e.health)+' · درجة '+esc(e.score_documented)+'/10<div class="meta">'+esc((e.role||'')+' · '+(e.evidence||'')+' · استخدام '+(e.used!=null?e.used+(e.cap!=null?'/'+e.cap:'')+' '+(e.unit||''):'غير مقاس')+' · '+e.score_basis)+'</div></div>';
   });
   (company.proposals||[]).forEach(p=>html+=row('اقتراح للمالك · '+p.target,p.reason+' · '+p.action));
  }else html=row('التقييمات','تعذّر قراءة local-data/company.json');
 }else if(tab==='compare'){
  title='مقارنة اليوم بأمس · سجلات فقط';
  const c=(company&&company.compare)||null;
  if(c){
   const i=c.ideas||{},s=c.status_snapshot||{};
   html+=row('أفكار أمس', (i.yesterday||{}).count+' فكرة · متوسط '+(i.yesterday||{}).mean_score);
   html+=row('أفكار اليوم', (i.today||{}).count+' فكرة · متوسط '+(i.today||{}).mean_score+' · Δ عدد '+(i.delta_count)+' · Δ متوسط '+(i.delta_mean));
   html+=row('ملاحظة الأفكار', i.note||'');
   html+=row('لقطة الحالة', 'يعمل موثق: '+(s.services_up)+'/'+(s.services_total)+' · روتينات فاشلة مسجلة: '+(s.routines_fail_recorded)+'/'+(s.routines_total));
   html+=row('لقطة أمس للحالة', s.yesterday_status_snapshot||'غير متوفر');
   (s.improvement_suggestions||[]).forEach(v=>html+=row('تحسين مقترح',v));
   (c.basis||[]).forEach(v=>html+=row('أساس المقارنة',v));
  }else html=row('المقارنة','لا يوجد قياس موثوق بعد');
 }else if(tab==='cmd'){
  title='أوامر المالك عبر CEO · مسودة فقط';
  // interactive command UI rendered after paginate bypass
  $('#panelRows').innerHTML='<div class="cmdbox"><textarea id="cmdText" placeholder="اكتب أمرك هنا… يمر عبر CEO ثم التوزيع الأنسب بعد التدقيق">'+(esc(cmdDraft))+'</textarea><div class="actions"><button type="button" id="cmdPreview">معاينة عبر CEO</button><button type="button" id="cmdVoice">صوت</button><button type="button" id="cmdClear">مسح</button></div><div class="note" id="cmdNote">لا إرسال فعلي · لا استلام من موظف · واتساب/تيليغرام يحتاجان ربطاً موثقاً</div><div id="cmdOut" class="rows" style="flex:1;min-height:0;overflow:hidden"></div></div>';
  $('#panelNav').innerHTML='<span class="meta">مسودة محلية</span>';
  const ta=$('#cmdText');
  try{cmdDraft=localStorage.getItem('hmk_ceo_cmd_draft')||cmdDraft;}catch(e){}
  ta.value=cmdDraft;
  const showPreview=()=>{
    cmdDraft=ta.value.trim();
    try{localStorage.setItem('hmk_ceo_cmd_draft',cmdDraft);}catch(e){}
    const out=$('#cmdOut');
    if(!cmdDraft){out.innerHTML=row('المعاينة','لا نص بعد');return;}
    out.innerHTML=row('مسودة لدى CEO',cmdDraft)+row('خبير الأوامر','سيراجع الصياغة قبل أي توزيع — لم يُرسل بعد')+row('التوزيع المقترح','COO للتشغيل أو القسم الأنسب حسب التقييمات — بانتظار اعتمادك')+row('الحالة','معاينة محلية فقط · لم يُنشأ تكليف ولم يستلم أي عامل')+channelRows();
  };
  $('#cmdPreview').onclick=showPreview;
  $('#cmdClear').onclick=()=>{cmdDraft='';ta.value='';try{localStorage.removeItem('hmk_ceo_cmd_draft');}catch(e){} $('#cmdOut').innerHTML='';};
  $('#cmdVoice').onclick=()=>{
    $('#cmdNote').textContent='الصوت غير متصل في هذه المعاينة: لا ميكروفون مصرّح ولا قناة backend صوتية. استخدم الكتابة + معاينة عبر CEO · بلا إرسال.';
  };
  if(cmdDraft)showPreview();
  return;
 }else if(tab==='ideas'){
  title='أفكار الإمارات · الأعلى جدوى أولاً';
  const list=(ideasLocal&&ideasLocal.ideas)||[];
  if(list.length){
   html+=row('المصدر', (ideasLocal.source||'')+' · '+time(ideasLocal.generated_at)+' · '+esc(ideasLocal.criteria_policy||''));
   list.forEach((idea,idx)=>{
     const t=idea.title||{}; const name=language==='en'?(t.en||t.ar):(t.ar||t.en)||idea.id;
     const verd=idea.study_verdict||{}; const vtxt=language==='en'?(verd.en||verd.ar):(verd.ar||verd.en)||'';
     html+='<div class="row"><strong>#'+(idx+1)+' · '+esc(name)+' · '+esc(idea.score)+'</strong><div class="meta">'+esc(vtxt||'دراسة مسجلة')+'</div></div>';
   });
  }else html=row('أفكار الإمارات','لا يوجد ملف محلي موثوق · لم تُرفع أفكار عشوائية');
 }
 if(!html && tab!=='cmd'){title+=' · السجل الفعلي';records.forEach(a=>html+='<div class="row">'+dot(a)+' <strong>'+esc(display(a))+'</strong> · '+esc(statusName(a))+'<div class="meta">'+esc(a.evidence||a.note||a.role||'الحالة من السجل المحلي')+'</div></div>');}
 if(!html && tab!=='cmd')html=row('المرشح الحالي','لا سجلات تطابق هذا المرشح. اختر «الكل».');
 if(tab!=='cmd'){
  $('#panelTitle').textContent=title;panelPage=paginate($('#panelRows'),html,panelPage,$('#panelNav'),p=>{panelPage=p;panel();});
  const area=$('#panelRows');[...area.children].forEach(n=>{n.style.minHeight=Math.max(0,Math.floor(area.clientHeight/area.children.length)-3)+'px';n.style.display='flex';n.style.flexDirection='column';n.style.justifyContent='center';});
 }else $('#panelTitle').textContent=title;
}
function details(s){selected=s;detailPage=0;$('#detail').classList.add('open');drawDetail();}
function drawDetail(){
 if(!selected)return;
 const s=offices.find(x=>x.key===selected.key)||selected;selected=s;
 $('#detailTitle').textContent=display(s);$('#detailSub').textContent='قسم · '+s.records.length+' سجل';
 let html='';s.records.forEach(a=>{
