<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMK · مقر الشركة</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#111c20;color:#ecf1e9;font:14px system-ui}button,a{font:inherit;color:inherit;cursor:pointer}button{background:#233438;border:1px solid #49605d;border-radius:12px;padding:10px}button:focus-visible,a:focus-visible{outline:3px solid #f4cf8b}main{height:100dvh;max-width:1400px;margin:auto;padding:22px;display:flex;flex-direction:column;gap:14px}header{display:flex;align-items:center;justify-content:space-between}small{color:#a8beb6;letter-spacing:2px}h1{margin:5px 0;font-size:26px}a{color:#efd09a;text-decoration:none}.intro{margin:0;color:#b1c4ba;font-size:12px}.stats{display:flex;gap:8px}.stats span{flex:1;background:#203035;border:1px solid #3b514d;padding:10px;border-radius:12px;font-size:12px}.office{position:relative;flex:1;min-height:0;border:1px solid #536860;border-radius:22px;background:#c9d1c2;overflow:hidden;box-shadow:inset 0 0 50px #526c6133}.floor{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 37px,#7b968415 38px 39px)}.corridor{position:absolute;inset:43% 0 43%;background:#b1beb0;border-block:1px solid #8b9f90}.rooms{position:absolute;inset:16px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:22% 14px}.room{border:1px solid #80978a;border-radius:16px;background:#eef0e1ba;padding:12px;position:relative;color:#35483e}.room h2{font-size:12px;margin:0}.desk{position:absolute;width:48px;height:25px;border-radius:8px;background:#bc9670;box-shadow:0 3px 0 #9b7756;bottom:24%;left:18%}.desk.second{left:auto;right:15%}.desk:before{content:'';position:absolute;width:23px;height:16px;background:#395657;border:3px solid #668180;border-radius:3px;top:-10px;left:13px}.plant{position:absolute;color:#3c7657;right:7%;top:32%;font-size:30px}.person{position:absolute;left:0;top:0;width:56px;padding:0;border:0;background:transparent;transition:transform 5s linear;z-index:2;filter:drop-shadow(0 5px 2px #273d3025)}.avatar{display:block;margin:auto;width:27px;height:36px;border-radius:13px 13px 9px 9px;background:var(--suit);position:relative;border:2px solid #e5e9d7}.avatar:before{content:'';position:absolute;width:16px;height:17px;left:3px;top:-11px;background:#e3be9a;border-radius:8px;border-top:5px solid #4c403b}.person em{display:block;font-style:normal;background:#1d3033e8;color:#fff;border-radius:6px;font-size:9px;padding:3px;margin-top:3px;white-space:nowrap}.person:hover{z-index:4}.person:hover .avatar{outline:3px solid #e6c48d}.lounge{position:absolute;top:46%;left:35%;font-size:10px;color:#4b6557;letter-spacing:3px}.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.roster button{font-size:11px;padding:10px 3px}footer{display:flex;justify-content:space-between;color:#9eb5aa;font-size:10px}dialog{position:absolute;inset:12px;width:calc(100% - 24px);max-width:650px;max-height:calc(100dvh - 24px);background:#182a2d;color:#eef1e7;border:1px solid #789082;border-radius:20px;padding:24px;overflow:hidden}dialog::backdrop{background:#071313bf;backdrop-filter:blur(5px)}dialog header{margin-bottom:20px}dialog h2{font-size:25px;margin:0}dialog p{line-height:1.7}label{color:#a5bdaf;font-size:11px;display:block}.value{font-size:18px;margin:7px 0 18px}.pill{color:#efcf91}progress{width:100%;accent-color:#e3c389}#stamp{max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(min-width:800px){.rooms{gap:22% 35px}.room{padding:20px}.room h2{font-size:17px}.desk{width:90px;height:38px}.roster button{font-size:14px}.person{width:80px}.person em{font-size:12px}.avatar{transform:scale(1.2)}}@media(max-height:650px){main{padding:10px;gap:7px}h1{font-size:20px}.stats span{padding:6px}.roster button{padding:6px 2px;font-size:10px}dialog{padding:16px}dialog p{font-size:12px;margin:7px 0}.value{font-size:15px;margin:4px 0 10px}dialog header{margin-bottom:10px}dialog h2{font-size:20px}}@media(prefers-reduced-motion:reduce){.person{transition:none}}
</style><main><header><div><small>HMK / WORKPLACE</small><h1>مقر الشركة</h1></div><a href="status.html">الحالة ↗</a></header><p class="intro">فريق الذكاء الاصطناعي · اختر موظفاً لمعرفة دوره واستخدامه</p><div class="stats"><span>٤ أقسام</span><span>١٢ موظفاً وأداة</span><span class="pill">حركة توضيحية</span></div><section class="office" aria-label="Interactive animated office"><div class="floor"></div><div class="corridor"></div><div class="rooms"></div><div class="lounge">HMK • LOUNGE</div><div id="people"></div></section><nav class="roster" aria-label="Employees"></nav><footer><span id="stamp">تحميل لقطة الاستخدام…</span><span>مرّر أو اضغط للتفاصيل</span></footer></main><dialog id="card"><header><h2 id="name"></h2><button id="close">رجوع ←</button></header><label>القسم / الدور</label><div class="value" id="role"></div><p id="description"></p><label>حالة الاتصال</label><p id="state"></p><label>الاستخدام المسجّل / الحد</label><div class="value" id="usage"></div><progress id="meter"></progress><p id="tip"></p><small>الحركة تمثيلية · حالة الاتصال تعتمد على القياس</small></dialog><script>
const $=s=>document.querySelector(s);const staff=[['claude','Claude','Strategy','#9f6658'],['codex','Codex','Engineering','#45666c'],['chatgpt','ChatGPT','Operations','#4f7b66'],['gemini','Gemini','Research','#6573a4'],['nlm','NotebookLM','Knowledge','#99815d'],['deepseek','DeepSeek','Engineering','#527da1'],['free','Free tools','Studio','#9778a2'],['scripts','Scripts','Automation','#77845c'],['ops','Ops agent','Operations','#718b6d'],['qa','QA agent','Quality review','#a27c68'],['research_agent','Research agent','Research','#777da1'],['build_agent','Build agent','Engineering','#537877']];let data={services:[]};const depts=['الإدارة والتخطيط / Strategy','الهندسة / Engineering','البحث والمعرفة / Research','الأتمتة والاستوديو / Studio'];$('.rooms').innerHTML=depts.map(n=>`<article class="room"><h2>${n}</h2><div class="desk"></div><div class="desk second"></div><div class="plant">♣</div></article>`).join('');
function open(id){const a=staff.find(a=>a[0]===id),s=data.services.find(s=>s.id===id)||{};$('#name').textContent=a[1];$('#role').textContent=s.role||a[2];$('#description').textContent=s.description||'Scheduled collection, validation and routine agents.';$('#state').textContent=(s.status||'unknown')+' · '+(s.evidence||'No authenticated health probe');$('#usage').textContent=s.used==null?'غير معروف / Unknown':`${s.used} ${s.unit||''} / ${s.cap??'—'} · ${s.period||'snapshot'}`;$('#meter').hidden=s.used==null||!s.cap;$('#meter').max=s.cap||100;$('#meter').value=s.used||0;$('#tip').textContent=s.tip||'Use repeatable scripts first; review results before reuse.';if(!$('#card').open)$('#card').showModal()}
for(const [id,n,r,c] of staff){const b=document.createElement('button');b.className='person';b.setAttribute('aria-label',n+' employee details');b.style.setProperty('--suit',c);b.innerHTML='<span class="avatar"></span><em>'+n+'</em>';b.onclick=()=>open(id);b.onpointerenter=e=>{if(e.pointerType==='mouse')open(id)};$('#people').append(b);const t=document.createElement('button');t.textContent=n;t.onclick=()=>open(id);$('.roster').append(t)}
let step=0;function walk(){const o=$('.office'),w=o.clientWidth,h=o.clientHeight;document.querySelectorAll('.person').forEach((b,i)=>{const room=(i+Math.floor(step/2))%4,col=room%2,row=Math.floor(room/2);const x=12+col*w*.48+(Math.floor(i/4)%2)*w*.21,y=65+row*h*.48+Math.floor(i/8)*h*.15+(step%2)*h*.07;if(step===0)b.style.transition='none';b.style.transform=`translate(${Math.min(w-65,x)}px,${Math.min(h-65,y)}px)`});step++;if(step===1)requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.person').forEach(b=>b.style.transition='')))}requestAnimationFrame(walk);setInterval(walk,5500);addEventListener('resize',walk);$('#close').onclick=()=>$('#card').close();$('#card').onclick=e=>{if(e.target===$('#card'))$('#card').close()};async function load(){try{const r=await fetch('status.json',{cache:'no-store'});data=await r.json();$('#stamp').textContent='Snapshot · '+data.generated_at}catch(e){$('#stamp').textContent='Telemetry unavailable'}}load();setInterval(load,60000);addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.lang==='en'){document.documentElement.dir='ltr';$('h1').textContent='Company headquarters';$('.intro').textContent='An AI team at work · select an employee for role and usage'}});if(parent!==self)parent.postMessage({hqReady:true},location.origin);
