<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">

<title>سوق مقر HMK</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#170e24;color:#fff;font-family:Tahoma,Arial,system-ui}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #fff;outline-offset:-3px}#app{height:100dvh;max-width:600px;margin:auto;display:flex;flex-direction:column;background:#261334;overflow:hidden}header{height:55px;flex:none;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;background:#5B2C83;border-top:4px solid #C8102E;border-bottom:3px solid #00843D}h1{font-size:17px;margin:0;color:#f4d994}header small{font-size:10px;color:#eadff2}#clock{font-size:13px;direction:ltr;font-variant-numeric:tabular-nums}#filters{display:flex;gap:5px;padding:7px 8px;flex:none;background:#1b1028}#filters button{flex:1;border:1px solid #77568c;background:#382046;border-radius:15px;padding:6px 0;font-size:11px}#filters .on{background:#e1bd65;border-color:#e1bd65;color:#21112e}.market{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}.strip{display:flex;justify-content:space-between;align-items:center;flex:none;height:28px;padding:0 10px;font-size:10px;background:#3c224d;color:#ead69d}.strip b{font-size:12px}#stage{position:relative;flex:1;min-height:0;background:#ae8660;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#stalls{position:absolute;inset:0}.stall{position:absolute;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;text-shadow:0 1px #000}.sign{background:#2c163eeF;border:1px solid #edcf89;border-radius:2px;color:#fff;font-weight:bold;font-size:12px;padding:4px 2px;line-height:1.2;min-height:25px;display:flex;align-items:center;justify-content:center;gap:5px}.subsign{background:#201226ed;border:1px solid #a7834a;font-size:9px;padding:3px 2px;color:#f0ddbc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c6a264;flex:none;box-shadow:0 0 0 2px #18101e}.dot.up{background:#45e086}.dot.error{background:#ff5264}.stall.dim{opacity:.38}.stall:hover .sign{background:#5B2C83}#marketNav,.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;padding:5px 9px;background:#251430;font-size:11px;min-height:31px}button.nav{border:1px solid #9c7a42;background:#4a2a61;border-radius:5px;padding:4px 12px;font-size:11px}button:disabled{opacity:.35;cursor:default}#panel{height:155px;flex:none;display:flex;flex-direction:column;padding:7px 9px;gap:5px;overflow:hidden;background:#21132e}#panel h2{margin:0;color:#e7c777;font-size:12px}.rows{min-height:0;flex:1;overflow:hidden}.row{border:1px solid #65427b;background:#392147;border-radius:4px;padding:6px 7px;margin-bottom:4px;font-size:11px;line-height:1.5;overflow-wrap:anywhere}.row button{background:none;border:0;width:100%;text-align:start;padding:0;font-size:11px}.row strong{color:#ecd297}.row .meta{color:#c6b2d1;font-size:10px}#tabs{display:flex;flex:none;background:#432258;border-top:1px solid #b99350}#tabs button{flex:1;background:none;border:0;font-size:10px;padding:9px 1px;color:#ddd0e5}#tabs .on{background:#5B2C83;color:#f9d77c}footer{flex:none;background:#08080a;text-align:center;color:white;font-size:10px;padding:5px;direction:ltr}#detail{display:none;position:absolute;inset:0;background:#241330;z-index:5;flex-direction:column;overflow:hidden;padding:10px;gap:8px}#detail.open{display:flex}.detailhead{display:flex;align-items:center;gap:9px;flex:none;border-bottom:2px solid #b69252;padding-bottom:8px}.detailhead h2{font-size:17px;color:#ecd297;margin:0;overflow-wrap:anywhere}.detailhead small{font-size:10px;color:#d1bdde}#detailRows{flex:1;min-height:0;overflow:hidden}#detail .row{padding:9px;font-size:12px;line-height:1.65}#detail .pager{border:1px solid #76518c;border-radius:5px}.source{font-size:10px;color:#bcacc8}.legend{font-size:9px;color:#c6b3d1;text-align:center;flex:none}#emptyFilter{display:none;position:absolute;bottom:3px;left:20px;right:20px;text-align:center;background:#281631ef;border:1px solid #c5a365;padding:5px;font-size:11px;pointer-events:none}@media(max-height:650px){header{height:45px}#panel{height:115px}#tabs button{padding:6px 0}.sign{font-size:10px;padding:2px}.subsign{font-size:8px}#filters{padding:4px 7px}#detail .row{padding:6px;font-size:11px}}
</style>
<div id="app">
<header><div><h1>سوق مقر HMK</h1><small>مقر الشركة الذكي · أروقة العمل</small></div><div id="clock"></div></header>
<nav id="filters" aria-label="تصفية الحالة"><button class="on" data-f="all">الكل</button><button data-f="working">يعمل الآن</button><button data-f="error">متعطل</button><button data-f="idle">خامل</button></nav>
<main class="market">
<div class="strip"><b>أهلًا في السوق</b><span id="count">قراءة السجل…</span></div>
<div id="stage"><canvas id="cv" aria-hidden="true"></canvas><div id="stalls"></div><div id="emptyFilter">لا سجلات تطابق هذا المرشح</div></div>
<div id="marketNav"></div>
<section id="panel"><h2 id="panelTitle"></h2><div id="panelRows" class="rows"></div><div id="panelNav" class="pager"></div></section>
<nav id="tabs"><button class="on" data-t="brief">إيجاز الصباح</button><button data-t="meeting">اجتماع الأحد</button><button data-t="levels">المستويات</button><button data-t="skills">مكتبة المهارات</button></nav>
<section id="detail" aria-label="تفاصيل البسطة"><div class="detailhead"><button class="nav" id="back">رجوع</button><div><h2 id="detailTitle"></h2><small id="detailSub"></small></div></div><div id="detailRows"></div><div class="pager" id="detailNav"></div><div class="source" id="detailSource"></div></section>
</main><footer>HMK made in ALAIN</footer></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let feed={rooms:[],agents:[],skills:[]},services=[],stalls=[],visible=[],filter='all',marketPage=0,panelPage=0,detailPage=0,tab='brief',selected=null,language=new URLSearchParams(location.search).get('lang')||'ar';
const privateEntry=a=>/kids|child|study|أطفال|اطفال|دراسة/i.test(String(a.id||'')+' '+String(a.room||''));
const state=a=>/^(fail|error|down|failed)$/i.test(a.status)?'error':/^(up|ok|working|running)$/i.test(a.status)?'up':'idle';
const statusName=a=>state(a)==='error'?'متعطل':state(a)==='up'?'يعمل / سليم':a.status==='idle'?'خامل':'غير معروف';
const matches=a=>filter==='all'||(filter==='working'?state(a)==='up':state(a)===filter);
const display=a=>language==='en'?(a.name_en||a.name||a.id):(a.name_ar||a.name||a.id);
const fmt=v=>typeof v==='object'?JSON.stringify(v):String(v);
function time(v){if(!v)return 'غير مسجل';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString(language==='en'?'en-GB':'ar-AE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function rebuild(){
 const agents=(feed.agents||[]).filter(a=>!privateEntry(a));
 const rooms=(feed.rooms||[]).filter(a=>!privateEntry(a));
 const ids=new Set(rooms.map(r=>r.id));
 agents.forEach(a=>{if(a.room&&!ids.has(a.room)){ids.add(a.room);rooms.push({id:a.room,name:a.room});}});
 stalls=rooms.map(r=>({...r,key:'room:'+r.id,records:agents.filter(a=>a.room===r.id).map(a=>({...a,_source:'hq payload'}))}));
 const loose=agents.filter(a=>!a.room);if(loose.length)stalls.push({id:'staff',key:'staff',name:'فريق المقر',records:loose.map(a=>({...a,_source:'hq payload'}))});
 services.filter(a=>!privateEntry(a)).forEach(s=>{
   const existing=stalls.find(r=>r.records.some(a=>a.id===s.id));
   if(existing){existing.records=existing.records.map(a=>a.id===s.id?{...a,...s,_source:'status.json + hq payload'}:a);}
   else stalls.push({id:s.id,key:'service:'+s.id,name:s.name,name_ar:s.name_ar,name_en:s.name_en,records:[{...s,_source:'status.json'}]});
 });
 render();
}
function dot(a){return '<i class="dot '+state(a)+'"></i>';}
function row(label,value){return '<div class="row"><strong>'+esc(label)+'</strong><div>'+esc(value)+'</div></div>';}
function pager(el,page,total,go){el.innerHTML='<button class="nav" '+(page===0?'disabled':'')+'>السابق</button><span dir="ltr">'+(page+1)+' / '+total+'</span><button class="nav" '+(page>=total-1?'disabled':'')+'>التالي</button>';el.firstChild.onclick=()=>go(page-1);el.lastChild.onclick=()=>go(page+1);}
// Split long source text before measuring pages; no clipped record or scrolling.
function paginate(el,html,page,nav,go){
 el.innerHTML='';const holder=document.createElement('div');holder.innerHTML=html;
 const queue=[],budget=el.clientHeight;
 [...holder.children].forEach(n=>{
  el.innerHTML=n.outerHTML;
  if(el.scrollHeight<=budget){queue.push(n.outerHTML);return;}
  const label=n.querySelector('strong')?.textContent||'سجل',words=(n.querySelector('strong')?n.lastElementChild.textContent:n.textContent).split(/\s+/);let part='';
  words.forEach(w=>{el.innerHTML=row(label,part+(part?' ':'')+w);if(el.scrollHeight>budget&&part){queue.push(row(label,part));part=w;}else part+=(part?' ':'')+w;});
  if(part)queue.push(row(label,part));
 });
 el.innerHTML='';const pages=[[]];
 queue.forEach(h=>{el.insertAdjacentHTML('beforeend',h);if(el.scrollHeight>budget&&pages.at(-1).length){pages.push([]);el.innerHTML=h;}pages.at(-1).push(h);});
 page=Math.max(0,Math.min(page,pages.length-1));el.innerHTML=pages[page].join('');pager(nav,page,pages.length,go);return page;
}
function panel(){
 let html='',title='';const records=stalls.flatMap(s=>s.records).filter(matches);
 if(tab==='brief'){
  title='دفتر السوق · آخر الأدلة';const b=feed.brief||{};
  [...(b.your_part||[]),...(b.needs_you||[])].forEach(v=>html+=row('من إيجاز المقر',v));
 }else if(tab==='meeting'){
  title='اجتماع الأحد · سجل المقر';const m=feed.meeting||{};
  (m.broke||[]).forEach(v=>html+=row(v.what,v.fix||''));(m.wins||[]).forEach(v=>html+=row('إنجاز',v));
 }else if(tab==='levels'){
  title='المستويات المسجلة';records.filter(a=>a.level!=null).forEach(a=>html+=row(display(a),a.level+'/10'));
 }else{title='مكتبة المهارات';(feed.skills||[]).forEach(v=>html+=row('مهارة مسجلة',typeof v==='string'?v:(v.name||v.title||fmt(v))));}
 if(!html){title+=' · السجل الفعلي';records.forEach(a=>html+='<div class="row">'+dot(a)+' <strong>'+esc(display(a))+'</strong> · '+esc(statusName(a))+'<div class="meta">'+esc(a.evidence||a.note||a.role||'الحالة من السجل المحلي')+'</div></div>');}
 if(!html)html=row('المرشح الحالي','لا سجلات تطابق هذا المرشح. اختر «الكل» لعرض سجل السوق.');
 $('#panelTitle').textContent=title;panelPage=paginate($('#panelRows'),html,panelPage,$('#panelNav'),p=>{panelPage=p;panel();});
 const area=$('#panelRows');[...area.children].forEach(n=>{n.style.minHeight=Math.max(0,Math.floor(area.clientHeight/area.children.length)-4)+'px';n.style.display='flex';n.style.flexDirection='column';n.style.justifyContent='center';});
}
function details(s){selected=s;detailPage=0;$('#detail').classList.add('open');drawDetail();}
function drawDetail(){
 if(!selected)return;
 const s=stalls.find(x=>x.key===selected.key)||selected;selected=s;
 $('#detailTitle').textContent=display(s);$('#detailSub').textContent='بسطة مستقلة · '+s.records.length+' سجل';
 let html='';s.records.forEach(a=>{
 html+='<div class="row">'+dot(a)+' <strong>'+esc(display(a))+'</strong><div>'+esc(statusName(a))+' · '+esc(a.status||'unknown')+'</div></div>';
 for(const [label,value] of [['الدور',a.role],['الوصف',a.description],['دليل الحالة',a.evidence||a.note||'لم يصل دليل حالة لهذا السجل.'],['آخر رصد / تشغيل',time(a.last_seen||a.last_run)],['التشغيلات المسجلة',a.runs],['التشغيلات الناجحة',a.successful_runs??a.ok],['نسبة النجاح',a.success_rate],['الاستخدام',a.used!=null?fmt(a.used)+(a.cap!=null?' / '+fmt(a.cap):'')+' '+(a.unit||''):null],['السقف المسجل',a.used==null&&a.cap!=null?fmt(a.cap)+' '+(a.unit||''):null],['الفترة',a.period],['استخدام اليوم',a.day_used!=null?fmt(a.day_used)+(a.day_cap!=null?' / '+fmt(a.day_cap):''):null],['تحديث الاستخدام',a.usage_updated?time(a.usage_updated):null],['نصيحة المصدر',a.tip]]){if(value!==undefined&&value!==null&&value!=='')html+=row(label,value);}
 (a.ideas||[]).forEach(v=>html+=row('فكرة من المصدر',typeof v==='string'?v:fmt(v)));
 });
 if(!s.records.length)html=row('قسم مسجل في المقر',display(s))+row('الحالة','غير معروف — لم تصل سجلات موظفين أو أدوات لهذا القسم في حمولة المقر.');
 $('#detailSource').textContent='المصدر: '+[...new Set(s.records.map(a=>a._source))].join(' • ')+(s.records.length?'':'hq payload')+' · '+time(feed.generated||statusGenerated);
 detailPage=paginate($('#detailRows'),html,detailPage,$('#detailNav'),p=>{detailPage=p;drawDetail();});
}
$('#back').onclick=()=>{selected=null;$('#detail').classList.remove('open');};
function render(){
 const matching=stalls.filter(s=>s.records.some(matches));
 visible=filter==='all'?stalls:matching;
 marketPage=Math.max(0,Math.min(marketPage,Math.max(0,Math.ceil(visible.length/8)-1)));
 const batch=visible.slice(marketPage*8,marketPage*8+8);
 $('#count').textContent=visible.length+' بسطة · '+stalls.flatMap(s=>s.records).filter(matches).length+' سجل';
 $('#emptyFilter').style.display=visible.length?'none':'block';
 // Keep market architecture visible when a filter has zero results, while dimming every stall.
 layout(batch.length?batch:stalls.slice(0,8),!batch.length);
 pager($('#marketNav'),marketPage,Math.max(1,Math.ceil(visible.length/8)),p=>{marketPage=p;render();});panel();if(selected)drawDetail();
}
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;marketPage=panelPage=0;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b));render();});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;panelPage=0;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));panel();});
let statusGenerated=null;
fetch('status.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('status');return r.json();}).then(s=>{services=s.services||[];statusGenerated=s.generated_at;rebuild();}).catch(()=>{rebuild();$('#count').textContent='تعذرت قراءة status.json';});
if(parent!==window)parent.postMessage({hqReady:true},location.origin);
addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.hq){feed=e.data.hq;language=e.data.lang||language;rebuild();}});
function tick(){$('#clock').textContent=new Date().toLocaleTimeString('ar-AE',{hour:'2-digit',minute:'2-digit'});}tick();setInterval(tick,1000);
// All figures, stock, textiles, lanterns and flags are drawn locally. Motion is decorative,
// never used as an assertion of connectivity or a count of completed work.
const cv=$('#cv'),ctx=cv.getContext('2d');let boxes=[],W=180,H=200;
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
const colors=['#00843D','#5B2C83','#C8102E','#5B2C83','#00843D','#C8102E','#5B2C83','#00843D'];
function layout(batch,dim){
 const r=$('#stage').getBoundingClientRect();W=180;H=Math.max(90,Math.round(r.height/r.width*180));cv.width=W;cv.height=H;
 const cols=Math.min(2,Math.max(1,batch.length)),rows=Math.ceil(Math.max(1,batch.length)/cols),rh=(H-13)/rows;
 boxes=batch.map((s,i)=>({s,i,x:cols===1?5:(i%2?96:5),y:10+Math.floor(i/cols)*rh,w:(cols===1||(batch.length%2&&i===batch.length-1))?170:79,h:rh-13}));
 $('#stalls').innerHTML=boxes.map(b=>{const a=b.s.records.find(a=>matches(a))||b.s.records[0]||{};return '<button class="stall '+(dim?'dim':'')+'" style="left:'+b.x/W*100+'%;top:'+b.y/H*100+'%;width:'+b.w/W*100+'%;height:'+b.h/H*100+'%" data-key="'+esc(b.s.key)+'" aria-label="'+esc(display(b.s))+'"><span class="sign">'+dot(a)+(language==='en'?'Stall · ':'بسطة · ')+esc(display(b.s))+'</span><span class="subsign">'+esc(b.s.records.length===1?(b.s.records[0].role||statusName(a)):b.s.records.length+' موظف / أداة')+' ↗</span></button>';}).join('');
 $('#stalls').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>details(boxes[i].s));
}
function person(x,y,i,t,carry){
 x=Math.round(x);y=Math.round(y);const step=Math.sin(t/90+i)>0?2:0;
 rect(x-2,y+8,9,2,'#533d3888');rect(x,y,5,5,'#dbad82');rect(x-1,y-1,7,2,i%3===0?'#fff':'#25172d');
 rect(x,y+5,5,6,['#fff2dc','#5B2C83','#00843D','#C8102E'][i%4]);rect(x-1,y+5,1,4,'#dfb68b');rect(x+5,y+5,1,4,'#dfb68b');rect(x,y+11,2,2+step,'#25182a');rect(x+3,y+11,2,4-step,'#25182a');
 if(carry){rect(x+3,y+5,7,5,'#cf9d50');rect(x+6,y+5,1,5,'#6e422d');rect(x+3,y+5,7,1,'#edcc87');}
}
function frame(t){
 rect(0,0,W,H,'#b38b63');for(let y=0;y<H;y+=8)for(let x=0;x<W;x+=12){rect(x+(y%16?6:0),y,11,1,'#987150');rect(x,y+1,1,7,'#c8a47a');}
 // Woven spine and cross aisles occupy the full souq, with stocked counters either side.
 rect(85,0,10,H,'#633458');for(let y=0;y<H;y+=8){rect(87,y,6,1,'#d3ac62');rect(89,y+3,2,2,'#a26772');}
 boxes.forEach(b=>{const {x,y,w,h,i}=b;rect(x-2,y+3,w+4,h+4,'#65432f');rect(x,y+4,w,h-3,'#d2ae74');
 rect(x+2,y+13,w-4,Math.max(5,h-21),'#3b253d');
 for(let sy=17;sy<h-13;sy+=12){rect(x+2,y+sy+7,w-4,2,'#a87842');for(let k=0;k<Math.floor((w-6)/8);k++){const bx=x+4+k*8;rect(bx,y+sy,6,6,['#d49b44','#739e54','#b35853','#9363ae'][(k+sy)%4]);rect(bx+1,y+sy-1,4,1,'#efd993');}}
 rect(x,y+h-10,w,7,'#ac713b');rect(x,y+h-10,w,2,'#e3ba73');for(let k=0;k<Math.floor((w-5)/10);k++)rect(x+5+k*10,y+h-8,6,3,['#9e557d','#d5a74b','#748747'][k%3]);
 // Canvas awning stripes and scallops behind the accessible signs.
 for(let k=0;k<10;k++){rect(x+k*w/10,y,w/10+1,14,k%2?'#eee3cc':colors[i%8]);rect(x+k*w/10,y+14,w/10-1,2,k%2?'#d0c3a4':colors[i%8]);}
 rect(x-1,y,1,h,'#d1ab64');rect(x+w,y,1,h,'#d1ab64');
 person(x+15+(Math.sin(t/500+i)*5),y+Math.min(h-22,27),i,t,false);
 const yy=y+h+1,xx=x+8+((t/45+i*17)%(w-20));person(xx,yy,i+4,t,true);
 if(Math.floor(t/1300+i)%5===0){rect(xx-2,yy-8,15,7,'#fff3d6');rect(xx+3,yy-1,2,2,'#fff3d6');rect(xx+1,yy-5,2,1,'#5B2C83');rect(xx+5,yy-5,2,1,'#5B2C83');}
 });
 // Shoppers travel the center aisle independently of service health.
 for(let i=0;i<3;i++)person(87+(i%2?1:-2),12+((t/65+i*H/3)%(Math.max(20,H-30))),i+7,t,i%2===0);
 rect(0,0,W,2,'#322037');for(let i=0;i<15;i++){const x=3+i*13,y=3+Math.round(Math.sin(i*.8+t/900));rect(x,y,3,4,i%3===0?'#C8102E':i%3===1?'#fff':'#00843D');rect(x+1,y+5,1,2,'#e7c56c');}
 requestAnimationFrame(frame);
}
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,80);});
rebuild();requestAnimationFrame(frame);
})();
</script>
</html>
