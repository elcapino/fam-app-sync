function office(){let rooms=[...(D.rooms||[])];D.agents.forEach(a=>{if(a.room&&!rooms.some(r=>r.id===a.room))rooms.push({id:a.room,name:a.room})});if(!rooms.length)rooms=[{id:'empty',name:tr('لا بيانات','No data')}];const filtered=rooms.filter(r=>f==='all'&&!query||r.id==='hr'&&(!query||roomName(r).toLowerCase().includes(query))||D.agents.some(a=>a.room===r.id&&matches(a)));rp=Math.min(rp,Math.max(0,Math.ceil(filtered.length/4)-1));let visible=filtered.slice(rp*4,rp*4+4);let s=`<title>${tr('مخطط مكتب حديث بأقسام زجاجية','Modern office floor plan with glass departments')}</title><defs><linearGradient id="floor" x2="1" y2="1"><stop stop-color="#efeee9"/><stop offset="1" stop-color="#cfcec8"/></linearGradient><linearGradient id="wood" x2="0" y2="1"><stop stop-color="#e5d2b2"/><stop offset="1" stop-color="#bca17c"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#f7ffff" stop-opacity=".75"/><stop offset="1" stop-color="#aac6cb" stop-opacity=".3"/></linearGradient><pattern id="tiles" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#bdbdb5" stroke-width=".6"/></pattern></defs><rect width="370" height="300" fill="url(#floor)"/><rect x="10" y="10" width="350" height="280" rx="7" fill="url(#tiles)" stroke="#8c9190" stroke-width="3"/><path d="M170 12V288M200 12V288" stroke="#bca773" stroke-width="1"/><path d="M183 32V268" stroke="#faf8f1" stroke-width="4" stroke-dasharray="18 9"/>`;

function getChecks(){try{return JSON.parse(localStorage.getItem('hq_checks')||'{}')}catch{return {}}}
function panel(){let rows=[],b=(L==='en'?D.brief_en:D.brief)||{},m=(L==='en'?D.meeting_en:D.meeting)||{};if(tab==='today'){['your_part','needs_you'].forEach((k,j)=>(b[k]||[]).forEach((text,i)=>rows.push({text,section:j?tr('يحتاجك','Needs you'):tr('دورك اليوم','Your part today'),check:'d:'+(b.date||'')+'|'+(j?'n':'p')+i})));}else if(tab==='tools'){rows=D.agents.filter(a=>a.kind==='tool'&&matches(a)).map(a=>({text:name(a)+' · '+usageSummary(a.usage),agent:a}));}else if(tab==='hr'){rows=(D.candidates||[]).filter(a=>!query||a.name.toLowerCase().includes(query)).map(a=>({text:a.name+' · '+tr('مرشح — بانتظار موافقتك','Candidate — awaiting your approval'),candidate:a}));}else if(tab==='quality'){rows=(D.quality?.items||[]).map(x=>({text:x[L],more:x[L]+' · '+tr('توليد: ','Generated by: ')+(D.quality?.provider||'')+' · '+(D.quality?.generated||'')}));}else if(tab==='meeting'){rows=[...(m.broke||[]).map(x=>({text:x.what,more:x.fix})),...(m.wins||[]).map(text=>({text}))]}else if(tab==='people'){rows=D.agents.filter(matches).map(a=>({text:name(a),agent:a,section:tr('المستوى','Level')+' '+(a.level||1)+'/10'}))}else rows=(D.skills||[]).map(text=>({text,skill:text}));let per=2;lp=Math.min(lp,Math.max(0,Math.ceil(rows.length/per)-1));let checks=getChecks();$('#items').innerHTML=rows.slice(lp*per,lp*per+per).map((r,i)=>`<button class="item ${r.check&&checks[r.check]?'done':''}" data-row="${i}">${r.check?'□':r.agent?'<i class="dot '+state(r.agent)+'"></i>':'◇'}<span>${esc(r.text)}</span>${r.section?`<small>${esc(r.section)}</small>`:''}</button>`).join('')||`<div class="empty">${tr('لا يوجد','Nothing here')}</div>`;$('#items').querySelectorAll('button').forEach(el=>el.onclick=()=>{let r=rows[lp*per+Number(el.dataset.row)];if(r.check){let c=getChecks();c[r.check]=!c[r.check];localStorage.setItem('hq_checks',JSON.stringify(c));panel()}else if(r.agent)openAgent(r.agent);else if(r.candidate)openCandidate(r.candidate);else if(r.skill)show(r.skill,D.agents.filter(a=>(a.skills||[]).includes function openRoom(r){if(r.id==='hr'){show(roomName(r),(D.candidates||[]).map(a=>({text:a.name+' · '+tr('مرشح — بانتظار موافقتك','Candidate — awaiting your approval'),candidate:a})));return}show(roomName(r),D.agents.filter(a=>a.room===r.id&&matches(a)).map(a=>({text:name(a)+' · '+tr({working:'يعمل',idle:'خامل',error:'خطأ'}[state(a)],state(a)),agent:a})))}
