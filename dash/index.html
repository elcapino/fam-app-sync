<style>

:root{--trk:#33205a;--acc:#6a4ba3;--g1:#9a7a22;--navh:64px;--bg:#160b27;--bg2:#1e1036;--card:#26154a;--line:#3d2768;--gold:#d4af37;--gold2:#f1d37a;--tx:#ffffff;--mu:#b3a3d1;--ok:#3ccf8e;--bad:#ef5b5b;--warn:#e8a93a;--blue:#5b8def}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.kpi:before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--gold)}

.chip{font:600 10px Plex;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid}

.dot{width:8px;height:8px;border-radius:50%;flex:none}
.fill{flex:1;min-height:0;display:flex;flex-direction:column}

#mtf{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));width:100%;height:220px;z-index:0;pointer-events:none;opacity:.55}#app{position:relative;z-index:1}.cp{font-size:9px;color:var(--mu);text-align:center}

@media (prefers-reduced-motion:reduce){#fut .rot{animation:none}}
.ib.th svg{fill:none}
.seg{display:flex;gap:4px;padding:3px;margin:0 0 8px;border-radius:12px;background:#ffffff10;border:1px solid #ffffff1a}.seg button{flex:1;border:0;background:none;color:inherit;font:600 12.5px Plex,sans-serif;padding:7px 0;border-radius:9px;cursor:pointer}.seg button.on{background:var(--gold);color:#160b27}[data-theme=future] .seg button.on{background:linear-gradient(90deg,#00e0c6,#2f7bff);color:#fff}.tbl.mk{font-size:11.5px}.tbl.mk td,.tbl.mk th{padding:5px 3px}.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:10.5px}

.summary-tabs{flex:none;margin:0}.summary-tabs button{font-size:11px;padding:6px 0}

/* HMK 1.4: fixed pages, five destinations, paginated proposals. */
header{gap:6px;padding-inline:10px}header>.logo{flex:1;min-width:0;letter-spacing:3px}header>.logo small{font-size:9px;letter-spacing:.3px;line-height:1.3}header>.sp{display:none}header>.ib{width:30px;flex:none}header>svg{width:22px;flex:none}

#pages{overflow:hidden;display:block}.pg{width:100%;height:100%}.pg[hidden],[hidden]{display:none!important}
.project-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0;grid-auto-rows:1fr}

body[data-page=ai] .ph h2{font-size:17px}body[data-page=ai] .pg{gap:6px}body[data-page=ai] .ai-card{gap:2px}body[data-page=ai] .ai-card h3{line-height:1.4}
/* Content grows in normal flow; each page scrolls above the navigation. */

.ph{flex-wrap:wrap}.ph .mu{overflow-wrap:anywhere}.row>*{min-width:0}
.market-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;flex:none;margin:0}

.idea-intro details{font-size:10px;margin-top:7px}.idea-intro summary{cursor:pointer}

.idea-card{display:flex;flex-direction:column;gap:12px;line-height:1.8;padding:15px;min-width:0;overflow-wrap:anywhere}
.idea-heading{display:flex;justify-content:space-between;align-items:center;gap:8px}.idea-score{font-size:26px;color:var(--gold2);font-weight:700}.idea-score small{font-size:12px;color:var(--mu)}

/* One screen: topics and detail sections use explicit pagination. */
#pages{overflow:hidden;display:block}.pg{overflow:hidden;padding:18px 16px;gap:14px}.pg>*{flex-shrink:1}.pg[hidden]{display:none!important}
.ns-heading{flex:none;border-bottom:1px solid var(--line);padding-bottom:12px}.ns-heading>span{font-size:10px;color:var(--gold2);letter-spacing:1px}.ns-heading h2{font-size:20px;line-height:1.6;margin:6px 0 0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
