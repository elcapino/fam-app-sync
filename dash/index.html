<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@font-face{font-family:Cairo;src:url(fonts/Cairo.ttf)}
:root{--bg:#05080b;--pan:#0b1218cc;--ln:#173040;--tx:#e8f1f2;--mu:#7f97a3;--neo:#2ef2c4;--cy:#38bdf8;--gd:#e2b867;--sand:#c89b5e;--red:#ff5d6c;--amb:#ffb547;--mono:ui-monospace,"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Cairo,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:10px 14px 8px;gap:8px}
header{display:flex;align-items:center;gap:14px;border:1px solid var(--ln);border-radius:14px;padding:6px 14px;background:linear-gradient(90deg,#0b1a20cc,#120f08cc);position:relative;overflow:hidden}
header svg.sky{position:absolute;inset:auto 0 0 0;width:100%;height:46px;opacity:.55}
.logo{font-weight:800;font-size:24px;letter-spacing:.5px;z-index:1}.logo b{color:var(--neo);text-shadow:0 0 12px #2ef2c488}
.tag{font-family:var(--mono);font-size:11px;color:var(--gd);z-index:1}
.dt{margin-inline-start:auto;text-align:end;z-index:1}.dt .t{font-family:var(--mono);font-size:22px;color:var(--neo)}.dt .d{font-size:12.5px;color:var(--mu)}
.btn{z-index:1;border:1px solid var(--neo);background:#06221c;color:var(--neo);border-radius:8px;padding:4px 10px;font:600 13px var(--mono);cursor:pointer}
.grid{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:1.25fr 1fr 1fr 1.25fr;grid-template-rows:1fr 1fr 1fr;
grid-template-areas:"brief house house sugg" "kids house house sugg" "kids apps spend wait" }
.c{background:var(--pan);border:1px solid var(--ln);border-radius:14px;padding:9px 12px;min-height:0;overflow:hidden;position:relative;backdrop-filter:blur(3px)}
.c::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:linear-gradient(135deg,#2ef2c40d,transparent 40%)}
.c h2{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:7px}
.c h2 .k{font:11px var(--mono);color:var(--cy);opacity:.8}
.dot{width:9px;height:9px;border-radius:50%;margin-inline-start:auto;box-shadow:0 0 8px currentColor}
.f0{background:var(--neo);color:var(--neo)}.f1{background:var(--amb);color:var(--amb)}.f2{background:var(--red);color:var(--red)}
.mu{color:var(--mu);font-size:12.5px}.mono{font-family:var(--mono)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-top:1px dashed #173040}
.pill{font:11.5px var(--mono);padding:1px 8px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--neo)}.wt{color:var(--amb)}.bd{color:var(--red)}.gd{color:var(--gd)}
.brief li{margin:1px 0;font-size:14px}.brief ul{margin:0;padding-inline-start:18px}.brief li::marker{content:"› ";color:var(--neo);font-family:var(--mono)}
/* house: falaj timeline */
.hs{display:flex;gap:16px;align-items:center;height:calc(100% - 26px)}
.ring{flex:0 0 132px}.ring text{font-family:var(--mono)}
.falaj{flex:1;display:flex;flex-direction:column;gap:3px;position:relative;padding-inline-start:20px}
.falaj::before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--cy),#0e3a4d)}
.st{position:relative;font-size:14px;display:flex;gap:10px;align-items:center}
.st::before{content:"";position:absolute;inset-inline-start:-18px;top:7px;width:11px;height:11px;border-radius:50%;border:2px solid var(--ln);background:var(--bg)}
.st.done::before{background:var(--neo);border-color:var(--neo)}.st.wait::before{border-color:var(--amb)}.st.next::before{border-color:var(--cy);box-shadow:0 0 8px var(--cy)}
.kid{border-top:1px dashed #173040;padding:4px 0}.kid b{font-size:14.5px}.kid .n{display:flex;gap:6px;margin:2px 0}
.kid .it{font-size:12.5px;color:#c6d6db;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:#0f202a;border-radius:6px;overflow:hidden;margin:3px 0 6px}.bar i{display:block;height:100%;border-radius:6px}
.sg{border-top:1px dashed #173040;padding:4px 0}.sg .t{font-weight:700;font-size:14px}.sg .b{font-size:12.5px;color:#c6d6db}
.sg .s{font-size:12.5px;color:var(--gd)}.sg a{color:var(--cy);font:11px var(--mono);text-decoration:none}
.fld{font:10.5px var(--mono);color:var(--bg);background:var(--neo);border-radius:4px;padding:0 5px;margin-inline-end:5px}
.dev{display:flex;flex-wrap:wrap;gap:2px 8px;font:11px var(--mono);margin-top:1px}
.heat{display:flex;gap:4px;margin-top:4px;align-items:flex-end;height:24px;flex:0 0 24px}.heat i{flex:1;border-radius:3px;background:var(--neo)}
footer{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mu)}footer .mono{color:var(--gd)}
.sugg .list{height:calc(100% - 26px);overflow:auto;scrollbar-width:thin}
.nav{display:none}
@media (max-width:760px){
 .grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px}
 .grid .c{flex:0 0 100%;scroll-snap-align:center}
 header{flex-wrap:wrap;gap:4px 10px}.logo{font-size:21px}.dt .t{font-size:18px}
 .hs{flex-direction:column}.ring{flex:0 0 auto}
 .nav{display:flex;justify-content:center;gap:6px}.nav i{width:7px;height:7px;border-radius:50%;background:#173040}.nav i.on{background:var(--neo);width:20px;border-radius:4px}
 footer{flex-direction:column;align-items:center}
}
</style></head><body>
