<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMK · Status</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#160f24;color:#f6f2fc;font:15px system-ui}main{height:100dvh;max-width:1100px;margin:auto;padding:18px;display:flex;flex-direction:column;gap:14px}header{display:flex;align-items:center;gap:12px}h1{font-size:23px;margin:0;color:#edd394}small,p{color:#bfb2cd}button,a{font:inherit;color:inherit;background:#292038;border:1px solid #574660;border-radius:12px;padding:12px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid #edd394}#content{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}#content>button{text-align:left;min-height:68px;display:flex;align-items:center;justify-content:space-between}#content>button span{color:#bfb2cd;font-size:12px}footer{display:flex;justify-content:space-between;align-items:center;font-size:12px}.card{border:1px solid #574660;border-radius:14px;padding:16px;overflow-wrap:anywhere;line-height:1.6}.card h2{font-size:20px;margin:0 0 12px}.line{margin:8px 0}.up,.online,.ok{color:#56d3a2}.down,.offline,.fail{color:#ff8492}.unknown{color:#e5c67e}iframe{width:100%;height:100%;min-height:0;border:0;border-radius:12px}progress{width:100%;accent-color:#56d3a2}#stamp{font-size:11px;margin:0}#notice{font-size:12px;min-height:30px;margin:0}
</style><main><header><button id="back" aria-label="Back">←</button><div><small>HMK / OPERATIONS</small><h1 id="title">Status</h1></div><button id="refresh" style="margin-left:auto" aria-label="Refresh">↻</button></header><p id="stamp">Loading live snapshot…</p><section id="content"></section><p id="notice">Unknown means telemetry is unavailable. Usage is a recorded snapshot.</p><footer><button id="prev">‹</button><span id="page"></span><button id="next">›</button></footer></main><script>
const LIVE='https://elcapino.github.io/fam-app-sync/dash/';const $=s=>document.querySelector(s);let data=null,view='home',group='',item=null,page=0;const groups={devices:'Devices',services:'Services',programs:'PC programs',routines:'Box routines'};const text=(el,s)=>el.textContent=s;const fmt=v=>v===null||v===undefined?'Unknown':String(v);const esc=s=>fmt(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function button(label,sub,fn){const b=document.createElement('button');b.innerHTML='<b>'+esc(label)+'</b><span>'+esc(sub||'›')+'</span>';b.onclick=fn;$('#content').append(b)}
function draw(){const c=$('#content');c.replaceChildren();$('#title').textContent=view==='home'?'Status':view==='company'?'HMK · Company':item?item.name:groups[group]||'Connections';$('#back').disabled=view==='home'&&self!==top;$('#prev').disabled=page===0;let count=1;
if(view==='home'){button('Connections','Devices & services',()=>{view='connections';draw()});button('Programs','PC & box health',()=>{view='programs';draw()});button('HMK company','Animated departments',()=>{view='company';draw()})}
if(view==='connections'||view==='programs'){for(const g of view==='connections'?['devices','services']:['programs','routines'])button(groups[g],(data?.[g]||[]).length+' records',()=>{group=g;view='list';page=0;draw()})}
if(view==='list'){const rows=data?.[group]||[];count=Math.max(1,Math.ceil(rows.length/5));page=Math.min(page,count-1);for(const r of rows.slice(page*5,page*5+5))button(r.name,r.status||r.startup,()=>{item=r;view='detail';draw()})}
if(view==='detail'){const box=document.createElement('article');box.className='card';box.innerHTML='<h2>'+esc(item.name)+'</h2>';for(const [k,v] of Object.entries(item)){if(k==='name'||k==='id'||v===null||v===undefined)continue;const line=document.createElement('div');line.className='line';line.textContent=k.replaceAll('_',' ')+': '+v;if(k==='status')line.classList.add(v);box.append(line)}if(item.cap&&item.used!=null){const p=document.createElement('progress');p.max=item.cap;p.value=item.used;box.append(p)}c.append(box)}
if(view==='company'){const f=document.createElement('iframe');f.title='HMK animated company HQ';f.src=new URL('hq.html?lang=en',location.protocol==='file:'?LIVE:location.href);f.onload=()=>sendHQ(f);c.append(f)}
$('#next').disabled=page>=count-1;$('#page').textContent=`${page+1} / ${count}`}
function sendHQ(f){if(!data)return;f.contentWindow.postMessage({lang:'en',hq:{usage_updated:data.generated_at,rooms:[],agents:data.services.map((s,i)=>({id:s.id,name:s.name,name_en:s.name,room:['meet','quality','research','research','hr','hr'][i],role:'Service employee',active:s.status==='up',status:s.status==='down'?'fail':s.status==='up'?'ok':'unknown',kind:'agent'}))}},new URL(f.src).origin)}
addEventListener('message',e=>{const f=$('iframe');if(f&&e.source===f.contentWindow&&e.data?.hqReady)sendHQ(f)});
$('#back').onclick=()=>{page=0;if(view==='detail'){view='list';item=null}else if(view==='list'){view=['devices','services'].includes(group)?'connections':'programs'}else if(view==='home'){location.href=new URL('index.html',location.protocol==='file:'?LIVE:location.href)}else view='home';draw()};$('#prev').onclick=()=>{page--;draw()};$('#next').onclick=()=>{page++;draw()};async function load(){try{const r=await fetch(new URL('status.json',location.protocol==='file:'?LIVE:location.href)+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();const stale=Date.now()-Date.parse(data.generated_at)>30*60000;$('#stamp').textContent=(stale?'STALE · ':'Updated · ')+data.generated_at;draw()}catch(e){$('#stamp').textContent='Live snapshot unavailable · '+e.message;draw()}}$('#refresh').onclick=load;load();setInterval(load,60000);
</script></html>
