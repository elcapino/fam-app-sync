<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMK · Operations status</title><style>
:root{color-scheme:dark;--bg:#101b21;--panel:#192930;--line:#354a50;--muted:#a2b7b9;--gold:#ebc88b;--mint:#7ed6b5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef1e9;font:14px system-ui}main{max-width:1500px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:34px;margin:7px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0}p{line-height:1.65;margin:8px 0;color:var(--muted)}small,.eyebrow{color:var(--muted);font-size:11px}.eyebrow{letter-spacing:2px;color:var(--gold)}button,a{font:inherit;cursor:pointer;color:inherit;background:#22353d;border:1px solid var(--line);border-radius:11px;padding:10px 14px;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid var(--gold)}button.active{background:var(--gold);color:#1c292a;border-color:var(--gold)}.actions{display:flex;gap:8px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.summary article{padding:20px;background:linear-gradient(125deg,#293d42,#1a2d32);border:1px solid var(--line);border-radius:16px}.summary strong{display:block;font-size:27px;color:var(--gold);margin-bottom:4px}nav{display:flex;gap:8px;margin:22px 0;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:22px;min-width:0}.card header{margin-bottom:14px}.badge{font-size:10px;letter-spacing:.5px;border:1px solid #68776c;color:var(--gold);border-radius:30px;padding:5px 8px;white-space:nowrap}.up,.ok,.online{color:var(--mint)}.down,.fail,.failed,.offline{color:#fa9a98}.role{color:var(--gold);font-size:12px;margin:12px 0 5px}.spend{font-size:23px;font-weight:650;margin-top:18px}.spend small{font-weight:400}progress{display:block;width:100%;height:6px;margin:10px 0 7px;accent-color:var(--mint)}.metrics{display:flex;gap:16px;border-block:1px solid var(--line);padding:14px 0;margin:18px 0}.metrics strong{display:block;font-size:20px}.metrics small{display:block;margin-top:3px}.runs{font-size:11px;display:flex;justify-content:space-between;margin:8px 0;gap:8px}.tip{border-left:2px solid var(--gold);padding-left:12px;font-size:12px;margin-top:18px}.ideas p{font-size:13px}.wide{grid-column:1/-1}.cache{margin-bottom:18px;padding:15px;border:1px solid var(--line);border-radius:12px}.muted{color:var(--muted)}footer{margin-top:24px;display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}#pager{display:none}#back{display:none}#error{color:#fa9a98}.detailhead{display:flex;justify-content:space-between;margin-bottom:12px}iframe{border:0;width:100%;height:650px;border-radius:16px}ul{padding-left:18px;color:var(--muted);line-height:1.7}#stamp{font-size:11px} @media(max-width:1000px) and (min-width:701px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){html,body{height:100%;overflow:hidden}main{height:100dvh;padding:16px;display:flex;flex-direction:column;gap:10px}h1{font-size:24px;margin:4px 0}header{flex:none}header .actions a{display:none}.summary{gap:7px;margin:3px 0;flex:none}.summary article{padding:10px 6px;border-radius:10px}.summary strong{font-size:19px}.summary small{font-size:9px}.lede{display:none}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0;flex:none}nav button{font-size:10px;padding:9px 2px}#content{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px}.mobile-row{text-align:left;display:flex;align-items:center;justify-content:space-between;padding:17px 12px;min-height:65px}.mobile-row b{font-size:14px}.mobile-row small{display:block;margin-top:4px;letter-spacing:0}.card{padding:15px;border-radius:13px}.card p{font-size:12px;line-height:1.5}.card .spend{font-size:21px;margin-top:10px}.card .metrics{padding:9px 0;margin:10px 0}.card .tip{margin-top:10px}.card h2{font-size:17px}.card .runs{font-size:10px}.card ul{font-size:12px}.card.detail{flex:1;min-height:0}.detailhead{margin-bottom:0;flex:none}.detailhead button{font-size:11px;padding:7px 10px}.cache{font-size:11px;margin:0;padding:10px}.cache p{font-size:11px}#pager{display:flex;justify-content:space-between;align-items:center;flex:none;font-size:11px}#pager button{padding:8px 16px}footer{font-size:9px;margin:0;flex:none}iframe{height:100%;flex:1;min-height:0}#stamp{font-size:9px;margin:0}#error{font-size:11px;margin:0}.eyebrow{font-size:9px}.actions button{padding:9px}#back{display:inline-block}}
</style><main><header><div><div class="eyebrow">HMK / OPERATIONS INTELLIGENCE</div><h1>Program control room</h1></div><div class="actions"><a href="hq.html">Visit HQ ↗</a><button id="refresh" aria-label="Refresh telemetry">↻</button></div></header><p class="lede">Your connected tools, recorded costs and next opportunities — in one place.</p><p id="stamp">Loading snapshot…</p><p id="error" hidden></p><section class="summary" aria-label="Overview"></section><nav aria-label="Dashboard sections"></nav><section id="content" class="grid"></section><div id="pager"></div><footer><span>Unknown = no reliable telemetry. Movement in HQ is illustrative.</span><span>HMK · recorded usage</span></footer></main><script>
const LIVE='https://elcapino.github.io/fam-app-sync/dash/';const $=s=>document.querySelector(s),esc=s=>String(s??'Unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,tab=new URLSearchParams(location.search).has('company')?'hq':'services',page=0,selected=null,detailPage=0;const mobile=()=>matchMedia('(max-width:700px)').matches;const tabs={services:'AI & services',programs:'PC programs',routines:'Agents & scripts',devices:'Connections',ideas:'Ideas & savings',hq:'Company HQ'};const fmt=n=>n==null?'Unknown':n;const time=t=>t?String(t).replace('T',' ').slice(0,16)+' UTC':'No recorded run';
function usage(s){if(s.used==null)return '<div class="spend">Unknown <small>usage</small></div><p>Allowance or meter not connected.</p>';return `<div class="spend">${esc(s.unit==='$'||s.unit==='USD'?'$':'')}${esc(s.used)} <small>/ ${esc(s.cap)} ${esc(s.unit==='%'?'%':s.unit==='USD'?'USD':s.unit||'')} · ${esc(s.period||'snapshot')}</small></div><progress max="${Number(s.cap)||100}" value="${Number(s.used)||0}"></progress><small>${s.cap?Math.max(0,Math.round((s.cap-s.used)*100)/100)+' remaining':'Cap unverified'} · recorded snapshot</small>${s.day_cap?`<p>Daily: $${esc(s.day_used??'Unknown')} / $${esc(s.day_cap)}</p>`:''}`}
function runHTML(s){return `<div class="metrics"><div><strong>${fmt(s.runs)}</strong><small>recorded attempts</small></div><div><strong>${s.success_rate==null?'—':s.success_rate+'%'}</strong><small>success · all recorded attempts</small></div></div><small>LAST RUNS · ${esc(s.last_seen||s.last_run||'No record')}</small>${s.last_runs?.length?s.last_runs.map(r=>`<div class="runs"><span>${esc(time(r.timestamp))}</span><span class="${esc(r.status)}">${esc(r.status)}</span></div>`).join(''):'<p>No structured call history.</p>'}`}
function heading(s){return `<header><h2>${esc(s.name)}</h2><span class="badge ${esc(s.status||'unknown')}">${esc(s.status||s.runtime||'unknown')}</span></header>`}
function service(s,part=null){return `<article class="card ${part!==null?'detail':''}">${heading(s)}${part===null||part===0?`<div class="role">${esc(s.role)}</div><p>${esc(s.description)}</p><small>${esc(s.evidence||'No authenticated health probe')}</small>${usage(s)}${s.plan?'<p>'+esc(s.plan)+'</p>':''}`:''}${part===null||part===1?runHTML(s)+`<p class="tip">${esc(s.tip)}</p>`:''}</article>`}
function basic(s){return `<article class="card detail">${heading(s)}<p>${esc(s.role||s.evidence||'Scheduled automation and connectivity monitoring.')}</p>${s.installed!==undefined?`<p>Installed: ${s.installed?'Yes':'No'} · Startup: ${esc(s.startup)}</p>`:''}<p>Last observation: ${esc(s.last_seen||s.last_run||'Unknown')}</p>${s.scheduled!==undefined?`<p>Scheduled: ${s.scheduled?'Yes':'No'}</p>`:''}<p class="tip">${esc(s.tip||'A schedule or log timestamp does not confirm a successful run.')}</p><p>Usage, spending and success rate: unavailable without structured telemetry.</p></article>`}
function ideasRows(){const rows=data.services.map(s=>({name:s.name+' · use ideas',status:'guide',body:s.ideas||[s.tip]}));rows.push({name:'Integration ideas · least spend',status:'guide',body:data.integrations});for(const p of data.advice_cache?.providers||[])rows.push({name:p.provider+' · daily AI suggestions',status:p.status,body:p.ideas?.length?[...p.ideas,...p.integrations]:['Generation attempted; provider unavailable or public payload review pending. Editorial use ideas above remain available.'],actual:p.actual_provider});return rows}
function idea(s){return `<article class="card detail ideas">${heading(s)}<ul>${s.body.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul>${s.actual?'<p>Actual provider: '+esc(s.actual)+'</p>':''}<p class="tip">Daily cache: ${esc(data.advice_cache?.date)} · Editorial guidance is separate from generated suggestions.</p></article>`}
function draw(){if(!data)return;$('.summary').innerHTML=[['$'+(data.services.filter(s=>['claude','gemini','deepseek'].includes(s.id)).reduce((n,s)=>n+(Number(s.used)||0),0)).toFixed(2),'Recorded API spend'],['$100','Monthly API caps'],[data.services.filter(s=>s.status==='up').length+'/'+data.services.length,'Services verified up'],[data.services.filter(s=>s.status==='unknown').length,'Unknown services']].map(([n,l])=>`<article><strong>${n}</strong><small>${l}</small></article>`).join('');$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${v}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;page=0;selected=null;draw()});const c=$('#content');c.className=mobile()?'':'grid';c.replaceChildren();const pager=$('#pager');pager.replaceChildren();if(tab==='hq'){c.innerHTML='<iframe title="HMK animated HQ" src="'+(location.protocol==='file:'?LIVE: './')+'hq.html?lang=en"></iframe>';return}let rows=tab==='ideas'?ideasRows():data[tab]||[];let pages=Math.max(1,Math.ceil(rows.length/4));page=Math.min(page,pages-1);if(mobile()&&selected){const head=document.createElement('div');head.className='detailhead';head.innerHTML='<button id="return">← Titles</button>'+(tab==='services'?'<button id="part">'+(detailPage===0?'Runs & tips →':'← Role & usage')+'</button>':'');c.append(head);$('#return').onclick=()=>{selected=null;draw()};if($('#part'))$('#part').onclick=()=>{detailPage=1-detailPage;draw()};c.insertAdjacentHTML('beforeend',tab==='services'?service(selected,detailPage):tab==='ideas'?idea(selected):basic(selected));}else if(mobile()){for(const s of rows.slice(page*4,page*4+4)){const b=document.createElement('button');b.className='mobile-row';b.innerHTML=`<span><b>${esc(s.name)}</b><small>${esc(s.role||s.status||s.runtime||'Details and recorded telemetry')}</small></span><span>↗</span>`;b.onclick=()=>{selected=s;detailPage=0;draw()};c.append(b)}pager.innerHTML='<button id="prev">←</button><span>'+(page+1)+' / '+pages+' · '+rows.length+' records</span><button id="next">→</button>';$('#prev').disabled=page===0;$('#next').disabled=page===pages-1;$('#prev').onclick=()=>{page--;draw()};$('#next').onclick=()=>{page++;draw()}}else{if(tab==='ideas')c.innerHTML='<div class="cache wide">Daily suggestions cache · '+esc(data.advice_cache?.date)+'<p>Provider results include actual availability and provenance. Use ideas below are editorial until generation succeeds.</p></div>';c.innerHTML+=rows.map(s=>tab==='services'?service(s):tab==='ideas'?idea(s):basic(s)).join('')}}
async function load(){try{const base=location.protocol==='file:'?LIVE:location.href;const r=await fetch(new URL('status.json',base),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const fresh=await r.json();if(selected){selected=(fresh[tab]||[]).find(s=>s.name===selected.name)||selected}data=fresh;$('#stamp').textContent=(Date.now()-Date.parse(data.generated_at)>1800000?'STALE SNAPSHOT · ':'SNAPSHOT · ')+data.generated_at;$('#error').hidden=true;draw()}catch(e){$('#error').hidden=false;$('#error').textContent='Telemetry unavailable. '+e.message}}$('#refresh').onclick=load;addEventListener('resize',draw);load();setInterval(load,60000);
</script></html>
