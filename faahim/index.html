<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فاهم – Faahim</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#05502b"><link rel="icon" href="logo.svg">
<style>
@font-face{font-family:Cairo;src:url(fonts/Cairo.ttf);font-weight:200 1000}
:root{--g:#00843D;--gd:#05502b;--r:#C8102E;--k:#161616;--sand:#f6ead2;--gold:#C9962B;--gl:#F2C14E;--paper:#fffaf1}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden}
body{font-family:Cairo,system-ui,sans-serif;color:var(--k);display:flex;flex-direction:column;background:var(--sand)}
button{font-family:inherit}
/* header */
.hero{position:relative;color:#fff;padding:10px 12px 34px;background:linear-gradient(160deg,#0a9a4c,#05502b 70%);overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:url(skyline.svg) bottom/auto 100% repeat-x}
.hero::before{content:"";position:absolute;inset:0;opacity:.09;background:repeating-linear-gradient(45deg,#fff 0 2px,transparent 2px 14px),repeating-linear-gradient(-45deg,#fff 0 2px,transparent 2px 14px)}
.top{position:relative;z-index:1;display:flex;align-items:center;gap:8px}
.logo{width:42px;height:42px;border-radius:12px;box-shadow:0 4px 12px #0004;animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-3px) rotate(-3deg)}}
.brand{flex:1;line-height:1}.brand b{font-size:26px;font-weight:900;letter-spacing:.5px}.brand small{display:block;font-size:11px;opacity:.85;font-weight:600}
.pill{border:0;border-radius:999px;padding:5px 11px;font-weight:800;font-size:13px;background:#ffffff26;color:#fff;backdrop-filter:blur(4px);cursor:pointer;transition:.15s}
.pill:active{transform:scale(.92)}.star{background:linear-gradient(135deg,var(--gl),var(--gold));color:#3a2600}
.strip{position:relative;z-index:1;margin-top:7px;display:flex;flex-direction:column;gap:5px}
.date{font-size:12.5px;font-weight:700;display:flex;gap:4px 6px;flex-wrap:wrap;white-space:nowrap;overflow:hidden;align-items:center}.date span{opacity:.9}
.pr{display:flex;gap:4px}.pr div{flex:1;text-align:center;background:#ffffff1f;border-radius:10px;padding:2px 0;font-size:10.5px;line-height:1.25}.pr b{display:block;font-size:12.5px}
.pr .nx{background:var(--gl);color:#3a2600;box-shadow:0 0 0 2px #fff8;animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 5px #fff3}}
#cd{font-weight:900;color:var(--gl)}
/* body */
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:0 10px;margin-top:-22px;position:relative;z-index:2}
.search{display:flex;gap:6px;background:#fff;border-radius:18px;padding:5px;box-shadow:0 6px 18px #05502b30}
#q{flex:1;border:0;outline:0;font:600 15px Cairo;padding:6px 10px;background:transparent}
#go{border:0;border-radius:14px;background:var(--r);color:#fff;font-size:17px;padding:0 14px;cursor:pointer}
main{flex:1;min-height:0;background:var(--paper);border-radius:22px;padding:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 24px #0002;position:relative}
main::before{content:"";position:absolute;top:0;left:18px;right:18px;height:5px;border-radius:0 0 6px 6px;background:repeating-linear-gradient(90deg,var(--r) 0 10px,var(--k) 10px 20px,var(--gold) 20px 30px,#fff 30px 34px)}
.tabs{display:flex;gap:3px;margin-top:4px}.tabs .btn{flex:1;white-space:nowrap;font-size:12px;padding:6px 1px;background:var(--sand);color:var(--gd)}
.btn{border:0;border-radius:14px;padding:8px 10px;font-weight:800;font-size:14px;background:var(--g);color:#fff;cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.94)}.on{background:var(--gd)!important;color:#fff!important}
.pane{flex:1;min-height:0;overflow:hidden;margin-top:6px;display:flex;flex-direction:column;gap:6px;animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.big{font-size:clamp(15px,2.1vh,21px);line-height:1.6;font-weight:600}
.title{font-size:20px;font-weight:900;color:var(--gd)}
svg{width:100%;flex:1;min-height:0}
.src{font-size:10px;opacity:.65;line-height:1.3}.src a{color:var(--r)}
.opt{display:block;width:100%;margin:3px 0;background:var(--sand);color:var(--k);text-align:start}
.ok{background:#3fbf6f!important;color:#fff!important;animation:pop .3s}.no{background:#e45757!important;color:#fff!important;animation:shake .3s}
@keyframes pop{50%{transform:scale(1.05)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.tiles .btn{font-size:20px;min-width:44px}
.more{display:grid;grid-template-columns:1fr 1fr;gap:6px}.more a{background:var(--sand);border-radius:14px;padding:8px;color:var(--k);text-decoration:none;font-size:12px;font-weight:700;overflow:hidden}
u.g{text-decoration:none;border-bottom:2px dashed var(--r);background:#fdecea;border-radius:4px;cursor:pointer}
.ayah{background:#fbf3e2;border:3px solid transparent;border-image:repeating-linear-gradient(45deg,var(--r) 0 6px,var(--k) 6px 12px,var(--gold) 12px 18px) 6;padding:6px 10px;text-align:center;font-size:18px;line-height:1.9;color:#0b4d2c;font-weight:700}
.chipsv{display:flex;gap:6px;margin-top:8px}.chipsv div{flex:1;color:#fff;border-radius:14px;padding:6px;font-size:12px;font-weight:700;text-align:center}.chipsv b{display:block;font-size:24px}
/* home grid */
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:7px;min-height:0}
.tile{border:0;border-radius:18px;color:#fff;font:800 13px Cairo;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 4px 0 #0002;transition:.15s}
.tile{padding:6px 4px;gap:5px!important;justify-content:center}.tile i{font-style:normal;font-size:clamp(22px,4.2vh,32px);line-height:1;filter:drop-shadow(0 2px 2px #0003);transition:.2s}.tile span{display:block;max-width:100%;background:#0000004d;border-radius:9px;padding:2px 7px;font:900 clamp(12.5px,1.75vh,15px)/1.25 Cairo;color:#fff;text-shadow:0 1px 2px #000a;white-space:normal;text-align:center;overflow-wrap:anywhere;z-index:1}.tile:hover i{transform:scale(1.15) rotate(-6deg)}
.tile::after{pointer-events:none;content:"";position:absolute;inset:auto -20% -40% auto;width:70%;height:70%;border-radius:50%;background:#fff2}
.tile.wide{grid-column:span 2}
.feat{display:flex;gap:6px}.feat .btn{flex:1;font-size:12.5px;background:#fff;color:var(--gd);border:2px solid var(--sand)}
nav{display:flex;justify-content:space-around;padding:6px 10px 4px;background:var(--paper);box-shadow:0 -4px 14px #0001}
nav button{border:0;background:none;font:800 11px Cairo;color:#8a7a5a;display:flex;flex-direction:column;align-items:center;cursor:pointer}nav button i{font-style:normal;font-size:21px;transition:.2s}
nav .act{color:var(--r)}nav .act i{transform:translateY(-3px) scale(1.15)}
footer{text-align:center;font-size:9.5px;color:#8a7a5a;padding:0 0 4px;background:var(--paper)}
#sheet{position:fixed;inset:auto 0 0 0;background:var(--paper);border-top:6px solid var(--r);border-radius:24px 24px 0 0;padding:16px;max-height:60%;box-shadow:0 -8px 30px #0006;transform:translateY(110%);transition:.3s;z-index:9}#sheet.open{transform:none}
.bar{height:8px;background:var(--sand);border-radius:9px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,var(--r),var(--gl));transition:width 1s linear}
.lb{display:flex;align-items:center;gap:8px;background:var(--sand);border-radius:14px;padding:6px 10px;font-weight:800}.lb .av{font-size:24px}.lb .n{flex:1}.lb.me{outline:3px solid var(--gl)}
.badge{display:inline-block;background:#fff;border:2px solid var(--gold);border-radius:999px;padding:0 7px;font-size:12px;margin:2px}
@media (min-width:700px){.hero{padding:14px 22px 40px}.wrap{padding:0 22px}.grid{grid-template-columns:repeat(6,1fr)}main.split{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;column-gap:12px}main.split .tabs{grid-column:1/3}.pr div{font-size:12px}.pr b{font-size:15px}.date{font-size:14px}}
.cg{flex:1;grid-auto-rows:minmax(34px,1fr);gap:6px}.cg .tile{flex-direction:row;gap:6px!important;padding:4px 8px;justify-content:flex-start;min-height:0}.cg .tile i{font-size:22px}.cg .tile span{font-size:13.5px;background:#00000040}
.bdg{white-space:nowrap;overflow:hidden}@media (max-height:860px){.bdg{display:none}}
</style></head><body>
<header class="hero"><div class="top"><img class="logo" src="logo.svg" alt=""><div class="brand"><b id="bn">فاهم</b><small id="bs">Faahim · تعلّم كل شي ببساطة</small></div>
<button class="pill" id="me">🦅</button><span class="pill star">⭐ <b id="st">0</b></span><button class="pill" id="lang">EN</button></div>
<div class="strip"><div class="date" id="date"></div></div></header>
<div class="wrap"><div class="search"><input id="q" placeholder=""><button id="go">🔍</button></div>
<main id="main"><div class="tabs" id="tabs"></div><div class="pane" id="p1"></div><div class="pane" id="p2" style="display:none"></div></main></div>
<nav id="nav"><button data-nav="home" class="act"><i>🏠</i><span></span></button><button data-nav="comp"><i>🏆</i><span></span></button><button data-nav="news"><i>🆕</i><span></span></button><button data-nav="about"><i>ℹ️</i><span></span></button></nav>
<footer id="foot">© 2026 حمد الكعبي – جميع الحقوق محفوظة / All rights reserved</footer>
<div id="sheet"></div>
<script src="demos.js"></script><script src="quran.js"></script><script src="islam.js"></script><script src="uae.js"></script><script src="app.js"></script><script src="comp.js"></script><script src="shell.js"></script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'})</script>
</body></html>
